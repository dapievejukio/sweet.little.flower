<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>sweet.little.flower</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  background:
    radial-gradient(
      circle at top,
      #fff9f5 0%,
      #f7e9e3 50%,
      #ead6d1 100%
    );

  color: #72565b;
}

button,
input {
  font-family: inherit;
}

.pagina {
  width: 88%;
  max-width: 430px;

  margin: auto;

  padding-top: 8vh;
  padding-bottom: 60px;

  text-align: center;
}

.logo {
  font-size: 1.8rem;
  font-weight: 300;
  letter-spacing: 3px;

  color: #bc7e89;
}

.coracao {
  margin-top: 12px;
  margin-bottom: 45px;

  color: #d49ca6;
  font-size: 1.2rem;
}

.pergunta {
  margin-bottom: 28px;

  font-size: .72rem;
  letter-spacing: 3px;

  color: #9f767d;
}

.play {
  width: 82px;
  height: 82px;

  border: none;
  border-radius: 50%;

  background: #ce8c98;
  color: white;

  font-size: 1.5rem;

  cursor: pointer;

  box-shadow:
    0 10px 30px rgba(143,87,98,.22);
}

.play:active {
  transform: scale(.95);
}

.play:disabled {
  opacity: .45;
}

.ouvir {
  display: block;

  margin-top: 14px;
  margin-bottom: 32px;

  font-size: .65rem;
  letter-spacing: 2px;

  color: #ae898f;
}

.campo {
  width: 100%;

  padding: 17px 20px;

  border: 1px solid #e2c9c6;
  border-radius: 40px;

  outline: none;

  background: #fffaf7;

  color: #71555a;

  text-align: center;

  font-size: 16px;

  margin-bottom: 12px;
}

.campo::placeholder {
  color: #bea2a7;
}

.botao {
  width: 100%;

  padding: 16px;

  border: none;
  border-radius: 40px;

  background: #c68591;
  color: white;

  font-size: .78rem;
  letter-spacing: 2px;

  cursor: pointer;

  margin-top: 3px;
}

.botao-secundario {
  background: #fffaf7;
  color: #a97c84;

  border: 1px solid #e3cac7;
}

.mensagem {
  min-height: 35px;

  padding-top: 15px;

  color: #ae737e;

  font-size: .75rem;
}

.credito {
  margin-top: 15px;

  font-size: 10px;

  color: #b99b9f;
}

.credito a {
  color: #a97e85;
  text-decoration: none;
}

#areaPrincipal,
#painelAdmin,
#formUpload {
  display: none;
}

.subtitulo {
  margin-bottom: 25px;

  font-size: .72rem;
  letter-spacing: 2px;

  color: #a67c83;
}

.buscador {
  display: flex;

  padding: 6px;

  background: #fffaf7;

  border: 1px solid #e5ceca;
  border-radius: 40px;

  box-shadow:
    0 8px 25px rgba(110,75,82,.08);
}

#busca {
  min-width: 0;
  flex: 1;

  padding: 12px 15px;

  border: none;
  outline: none;

  background: transparent;

  color: #75585d;

  font-size: 16px;
}

.buscar {
  width: 46px;
  height: 46px;

  border: none;
  border-radius: 50%;

  background: #d3939e;
  color: white;

  cursor: pointer;
}

.linha-admin {
  margin-top: 20px;
}

.admin-link {
  border: none;
  background: transparent;

  color: #b28b91;

  font-size: 11px;

  cursor: pointer;

  letter-spacing: 1px;
}

.caixa {
  margin-top: 28px;

  padding: 25px 18px;

  border-radius: 25px;

  background:
    rgba(255,250,247,.72);

  border:
    1px solid #e5cfcb;
}

.caixa h2 {
  font-size: .75rem;

  font-weight: 500;

  letter-spacing: 2px;

  color: #9d777e;

  margin-bottom: 22px;
}

.upload-area {
  display: block;

  width: 100%;

  padding: 25px 15px;

  border:
    1px dashed #d6afb5;

  border-radius: 22px;

  background: #fffaf7;

  color: #ae8189;

  cursor: pointer;

  margin-bottom: 18px;
}

#arquivoFoto {
  display: none;
}

#preview {
  display: none;

  width: 100%;
  max-height: 340px;

  object-fit: cover;

  border-radius: 20px;

  margin-bottom: 18px;
}

.tags {
  display: flex;
  gap: 8px;

  margin-top: 12px;

  flex-wrap: wrap;
}

.tag {
  padding: 6px 11px;

  background: #f0dadd;

  border-radius: 20px;

  color: #916d74;

  font-size: 11px;
}

#resultado {
  margin-top: 30px;
}

.foto-card {
  margin-bottom: 28px;

  animation:
    aparecer .5s ease;
}

.foto-card img {
  width: 100%;

  border-radius: 22px;

  box-shadow:
    0 12px 35px
    rgba(95,65,72,.13);
}

@keyframes aparecer {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.separador {
  height: 1px;

  background: #ead4d1;

  margin: 25px 0;
}

.youtube-container {
  width: 200px;
  height: 200px;

  position: fixed;

  left: 0;
  bottom: 0;

  opacity: .001;

  overflow: hidden;

  pointer-events: none;

  z-index: -1;
}

#player {
  width: 200px;
  height: 200px;
}

.rodape {
  margin-top: 70px;

  color: #bea0a5;

  font-size: .6rem;
  letter-spacing: 2px;
}

</style>

</head>

<body>


<main class="pagina">


<div class="logo">
  sweet.little.flower
</div>

<div class="coracao">
  ♡
</div>



<!-- ==========================================
     QUIZ
========================================== -->

<section id="entrada">

  <div class="pergunta">
    quem está tocando?
  </div>


  <button
    id="play"
    class="play"
    disabled
  >
    ▶
  </button>


  <span
    id="status"
    class="ouvir"
  >
    preparando música...
  </span>


  <input
    id="resposta"
    class="campo"
    type="text"
    placeholder="sua resposta..."
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >


  <button
    id="entrar"
    class="botao"
  >
    entrar
  </button>


  <div
    id="mensagemQuiz"
    class="mensagem"
  ></div>


  <div class="credito">
    música via YouTube
  </div>

</section>



<!-- ==========================================
     ÁREA PRINCIPAL
========================================== -->

<section id="areaPrincipal">


  <div class="subtitulo">
    ♡ encontre sua lembrança
  </div>


  <div class="buscador">

    <input
      id="busca"
      type="text"
      placeholder="buscar por tag..."
      autocomplete="off"
    >

    <button
      id="botaoBuscar"
      class="buscar"
    >
      ♡
    </button>

  </div>


  <div id="resultado"></div>


  <div class="linha-admin">

    <button
      id="abrirAdmin"
      class="admin-link"
    >
      + adicionar foto
    </button>

  </div>



  <!-- LOGIN / ADMIN -->

  <section
    id="painelAdmin"
    class="caixa"
  >

    <h2>
      área privada
    </h2>


    <div id="loginAdmin">


      <input
        id="adminEmail"
        class="campo"
        type="email"
        placeholder="e-mail"
        autocomplete="email"
      >


      <input
        id="adminSenha"
        class="campo"
        type="password"
        placeholder="senha"
        autocomplete="current-password"
      >


      <button
        id="botaoLogin"
        class="botao"
      >
        entrar
      </button>


    </div>



    <!-- UPLOAD -->

    <div id="formUpload">


      <label
        for="arquivoFoto"
        class="upload-area"
      >
        ＋ escolher foto
      </label>


      <input
        id="arquivoFoto"
        type="file"
        accept="image/*"
      >


      <img
        id="preview"
        alt="Prévia"
      >


      <input
        id="tag1"
        class="campo"
        type="text"
        placeholder="tag 1"
      >


      <input
        id="tag2"
        class="campo"
        type="text"
        placeholder="tag 2"
      >


      <input
        id="tag3"
        class="campo"
        type="text"
        placeholder="tag 3"
      >


      <button
        id="salvarFoto"
        class="botao"
      >
        salvar foto ♡
      </button>


      <button
        id="logout"
        class="botao botao-secundario"
      >
        sair do admin
      </button>


    </div>


    <div
      id="mensagemAdmin"
      class="mensagem"
    ></div>


  </section>


</section>



<div class="rodape">
  sweet.little.flower
</div>


</main>



<!-- PLAYER -->

<div class="youtube-container">
  <div id="player"></div>
</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- YOUTUBE -->

<script src="https://www.youtube.com/iframe_api"></script>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://frhnpapvadekxesrrghz.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_SrmmFNDZr8heA8s7_1Dwow_evdBY-Ol";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const BUCKET =
  "sweet-little-flower";



/* =====================================================
   MÚSICAS
===================================================== */

const artistas = [

  {
    artista: "Måneskin",
    video: "HZnNt9nnEhw",
    inicio: 25,

    respostas: [
      "maneskin",
      "måneskin"
    ]
  },


  {
    artista: "Damiano David",
    video: "BD8jIlBA1nA",
    inicio: 25,

    respostas: [
      "damiano",
      "damiano david"
    ]
  },


  {
    artista: "ILLIT",
    video: "Vk5-c_v4gMU",
    inicio: 28,

    respostas: [
      "illit"
    ]
  },


  {
    artista: "BLACKPINK",
    video: "gQlMMD8auMs",
    inicio: 30,

    respostas: [
      "blackpink",
      "black pink"
    ]
  },


  {
    artista: "Mamonas Assassinas",
    video: "Nz7101ulkK0",
    inicio: 30,

    respostas: [
      "mamonas",
      "mamonas assassinas"
    ]
  }

];


let indiceAtual =
  Math.floor(
    Math.random() *
    artistas.length
  );


let musicaAtual =
  artistas[indiceAtual];


let player;

let playerPronto =
  false;

let tocando =
  false;



/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto) {

  return texto
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}



/* =====================================================
   YOUTUBE
===================================================== */

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        width: "200",
        height: "200",

        videoId:
          musicaAtual.video,

        playerVars: {

          playsinline: 1,
          controls: 0,
          rel: 0,

          start:
            musicaAtual.inicio,

          origin:
            window.location.origin

        },

        events: {

          onReady: function() {

            playerPronto =
              true;

            document
              .getElementById("play")
              .disabled =
              false;

            document
              .getElementById("status")
              .textContent =
              "toque para ouvir";

          },


          onStateChange:
            function(event) {

              const botao =
                document.getElementById(
                  "play"
                );


              if (
                event.data ===
                YT.PlayerState.PLAYING
              ) {

                tocando = true;

                botao.textContent =
                  "❚❚";

              }


              if (
                event.data ===
                YT.PlayerState.PAUSED
              ) {

                tocando = false;

                botao.textContent =
                  "▶";

              }

            },


          onError:
            function() {

              document
                .getElementById("status")
                .textContent =
                "música indisponível";

            }

        }

      }
    );

}



document
  .getElementById("play")
  .addEventListener(
    "click",
    function() {

      if (!playerPronto)
        return;


      if (tocando) {

        player.pauseVideo();

      }

      else {

        player.playVideo();

      }

    }
  );



/* =====================================================
   QUIZ
===================================================== */

function validarQuiz() {

  const valor =
    normalizar(
      document
        .getElementById("resposta")
        .value
    );


  const corretas =
    musicaAtual
      .respostas
      .map(normalizar);


  if (
    corretas.includes(valor)
  ) {

    if (player)
      player.pauseVideo();


    document
      .getElementById("entrada")
      .style.display =
      "none";


    document
      .getElementById("areaPrincipal")
      .style.display =
      "block";


    verificarSessao();

  }

  else {

    document
      .getElementById("mensagemQuiz")
      .textContent =
      "tente outra vez ♫";

  }

}



document
  .getElementById("entrar")
  .addEventListener(
    "click",
    validarQuiz
  );


document
  .getElementById("resposta")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter")
        validarQuiz();

    }
  );



/* =====================================================
   ABRIR ADMIN
===================================================== */

document
  .getElementById("abrirAdmin")
  .addEventListener(
    "click",
    function() {

      const painel =
        document.getElementById(
          "painelAdmin"
        );


      painel.style.display =
        painel.style.display === "block"
          ? "none"
          : "block";

    }
  );



/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById("botaoLogin")
  .addEventListener(
    "click",
    login
  );


async function login() {

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();


  const senha =
    document
      .getElementById("adminSenha")
      .value;


  const mensagem =
    document
      .getElementById(
        "mensagemAdmin"
      );


  mensagem.textContent =
    "entrando...";


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email:
        email,

      password:
        senha

    });


  if (error) {

    mensagem.textContent =
      "e-mail ou senha incorretos";

    return;

  }


  mensagem.textContent =
    "admin conectado ♡";


  mostrarUpload();

}



/* =====================================================
   VERIFICAR SESSÃO
===================================================== */

async function verificarSessao() {

  const {
    data
  } =
    await db.auth.getSession();


  if (
    data.session
  ) {

    mostrarUpload();

  }

}



function mostrarUpload() {

  document
    .getElementById("loginAdmin")
    .style.display =
    "none";


  document
    .getElementById("formUpload")
    .style.display =
    "block";

}



/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function() {

      await db.auth.signOut();


      document
        .getElementById("formUpload")
        .style.display =
        "none";


      document
        .getElementById("loginAdmin")
        .style.display =
        "block";


      document
        .getElementById("mensagemAdmin")
        .textContent =
        "admin desconectado";

    }
  );



/* =====================================================
   PREVIEW
===================================================== */

document
  .getElementById("arquivoFoto")
  .addEventListener(
    "change",
    function(event) {

      const arquivo =
        event.target.files[0];


      if (!arquivo)
        return;


      const preview =
        document.getElementById(
          "preview"
        );


      preview.src =
        URL.createObjectURL(
          arquivo
        );


      preview.style.display =
        "block";

    }
  );



/* =====================================================
   UPLOAD
===================================================== */

document
  .getElementById("salvarFoto")
  .addEventListener(
    "click",
    salvarFoto
  );


async function salvarFoto() {

  const input =
    document.getElementById(
      "arquivoFoto"
    );


  const arquivo =
    input.files[0];


  const tag1 =
    normalizar(
      document
        .getElementById("tag1")
        .value
    );


  const tag2 =
    normalizar(
      document
        .getElementById("tag2")
        .value
    );


  const tag3 =
    normalizar(
      document
        .getElementById("tag3")
        .value
    );


  const mensagem =
    document.getElementById(
      "mensagemAdmin"
    );


  if (!arquivo) {

    mensagem.textContent =
      "escolha uma foto";

    return;

  }


  if (
    !tag1 ||
    !tag2 ||
    !tag3
  ) {

    mensagem.textContent =
      "preencha as 3 tags";

    return;

  }


  mensagem.textContent =
    "enviando foto...";


  /*
  Nome único para evitar conflito
  */

  const extensao =
    arquivo.name
      .split(".")
      .pop()
      .toLowerCase();


  const nomeArquivo =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,8)
    +
    "." +
    extensao;



  /*
  UPLOAD STORAGE
  */

  const {
    error:
      erroUpload
  } =
    await db
      .storage
      .from(BUCKET)
      .upload(
        nomeArquivo,
        arquivo,
        {

          cacheControl:
            "3600",

          upsert:
            false

        }
      );


  if (erroUpload) {

    console.error(
      erroUpload
    );


    mensagem.textContent =
      "erro ao enviar a foto";

    return;

  }



  /*
  GRAVAR TAGS
  */

  const {
    error:
      erroBanco
  } =
    await db
      .from("fotos")
      .insert({

        arquivo:
          nomeArquivo,

        tag1:
          tag1,

        tag2:
          tag2,

        tag3:
          tag3

      });


  if (erroBanco) {

    console.error(
      erroBanco
    );


    /*
    Se o banco falhar,
    removemos a foto que
    acabou de subir.
    */

    await db
      .storage
      .from(BUCKET)
      .remove([
        nomeArquivo
      ]);


    mensagem.textContent =
      "erro ao salvar as tags";

    return;

  }



  mensagem.textContent =
    "foto salva ♡";


  input.value =
    "";


  document
    .getElementById("tag1")
    .value =
    "";


  document
    .getElementById("tag2")
    .value =
    "";


  document
    .getElementById("tag3")
    .value =
    "";


  document
    .getElementById("preview")
    .style.display =
    "none";

}



/* =====================================================
   BUSCA
===================================================== */

document
  .getElementById("botaoBuscar")
  .addEventListener(
    "click",
    buscar
  );


document
  .getElementById("busca")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter")
        buscar();

    }
  );


async function buscar() {

  const termo =
    normalizar(
      document
        .getElementById("busca")
        .value
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.innerHTML =
    "";


  if (!termo)
    return;



  /*
  Para esta primeira versão,
  a busca requer sessão admin,
  pois o bucket é privado
  e nossas policies são
  authenticated.
  */

  const {
    data:
      sessao
  } =
    await db.auth.getSession();


  if (
    !sessao.session
  ) {

    resultado.innerHTML =
      "<div class='mensagem'>entre no admin para testar a busca privada ♡</div>";

    return;

  }



  resultado.innerHTML =
    "<div class='mensagem'>procurando...</div>";



  const {
    data:
      fotos,
    error
  } =
    await db
      .from("fotos")
      .select("*")
      .or(
        `tag1.eq.${termo},tag2.eq.${termo},tag3.eq.${termo}`
      )
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (error) {

    console.error(error);

    resultado.innerHTML =
      "<div class='mensagem'>erro na busca</div>";

    return;

  }


  if (
    !fotos ||
    fotos.length === 0
  ) {

    resultado.innerHTML =
      "<div class='mensagem'>nenhuma lembrança encontrada ♡</div>";

    return;

  }


  resultado.innerHTML =
    "";


  for (
    const foto of fotos
  ) {


    /*
    URL temporária:
    10 minutos
    */

    const {
      data:
        assinatura,
      error:
        erroUrl
    } =
      await db
        .storage
        .from(BUCKET)
        .createSignedUrl(
          foto.arquivo,
          600
        );


    if (
      erroUrl ||
      !assinatura
    ) {

      console.error(
        erroUrl
      );

      continue;

    }


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "foto-card";


    card.innerHTML = `

      <img
        src="${assinatura.signedUrl}"
        alt="lembrança"
      >

      <div class="tags">

        <span class="tag">
          ${foto.tag1}
        </span>

        <span class="tag">
          ${foto.tag2}
        </span>

        <span class="tag">
          ${foto.tag3}
        </span>

      </div>

    `;


    resultado.appendChild(
      card
    );

  }

}

</script>

</body>
</html>
