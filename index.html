    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background:

          circle at top,
          #fff9f5 0%,
          #f7e9e3 50%,
          #ead6d1 100%

      color: #72565b;
    }

    button,

      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

      width: 88%;
      max-width: 430px;
      margin: auto;
      padding-top: 8vh;
      padding-bottom: 60px;
      text-align: center;

      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #bc7e89;
    }

      margin-top: 12px;
      margin-bottom: 42px;
      color: #d49ca6;
      font-size: 1.2rem;

    .pergunta {
      margin-bottom: 12px;
      font-size: .72rem;
      letter-spacing: 3px;
      color: #9f767d;
    }

    .modo-quiz {
      min-height: 30px;
      margin-bottom: 18px;
      color: #bc8b94;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .play {
      width: 82px;
      height: 82px;
      border: none;
      border-radius: 50%;
      background: #ce8c98;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(143, 87, 98, .22);
    }

    .play:active {
      transform: scale(.94);
    }

    .play:disabled {
      opacity: .45;
    }

    .ouvir {
      display: block;
      margin-top: 14px;
      margin-bottom: 30px;
      font-size: .65rem;
      letter-spacing: 2px;
      color: #ae898f;
    }

    .campo {
      width: 100%;
      padding: 17px 20px;
      margin-bottom: 12px;
      border: 1px solid #e2c9c6;
      border-radius: 40px;
      outline: none;
      background: #fffaf7;
      color: #71555a;
      text-align: center;
      font-size: 16px;
    }

    .campo:focus {
      border-color: #c98b96;
    }

    .campo::placeholder {
      color: #bea2a7;
    }

    .botao {
      width: 100%;
      padding: 16px;
      margin-top: 3px;
      border: none;
      border-radius: 40px;
      background: #c68591;
      color: white;
      font-size: .78rem;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .botao:disabled {
      opacity: .5;
      cursor: default;
    }

    .botao-secundario {
      margin-top: 10px;
      background: #fffaf7;
      color: #a97c84;
      border: 1px solid #e3cac7;
    }

    .mensagem {
      min-height: 35px;
      padding-top: 15px;
      color: #ae737e;
      font-size: .75rem;
      line-height: 1.5;
    }

    .credito {
      margin-top: 15px;
      font-size: 10px;
      color: #b99b9f;
    }

    #areaPrincipal,
    #painelAdmin,
    #formUpload {
      display: none;
    }

    .subtitulo {
      margin-bottom: 25px;
      font-size: .72rem;
      letter-spacing: 2px;
      color: #a67c83;
    }

    .buscador {
      display: flex;
      padding: 6px;
      background: #fffaf7;
      border: 1px solid #e5ceca;
      border-radius: 40px;

      box-shadow:
        0 8px 25px
        rgba(110, 75, 82, .08);

    #busca {
      min-width: 0;
      flex: 1;
      padding: 12px 15px;
      border: none;
      outline: none;
      background: transparent;
      color: #75585d;
      font-size: 16px;

    .buscar {
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #d3939e;
      color: white;
      cursor: pointer;

    .acoes-principais {
      display: flex;
      gap: 8px;
      margin-top: 17px;
    }

    .acao-mini {
      flex: 1;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #e3cac7;
      border-radius: 30px;
      background: rgba(255,250,247,.72);
      color: #aa7e86;
      font-size: 10px;

      width: 200px;
      height: 200px;
      opacity: .001;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }


    /* TOAST */

    #toastContainer {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 390px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      position: relative;
      padding: 16px 42px 16px 18px;
      border: 1px solid #e5c9cc;
      border-radius: 20px;
      background: rgba(255,250,247,.98);
      color: #8d6870;
      font-size: 13px;
      text-align: left;

      box-shadow:
        0 12px 35px
        rgba(102,68,75,.15);
    }


    /* MODAL */

    #modalFundo {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 8000;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(92,65,70,.36);
      backdrop-filter: blur(6px);
    }

    #modalFundo.aberto {
      display: flex;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 390px;
      padding: 28px 20px;
      border: 1px solid #e5c9cc;
      border-radius: 28px;
      background: #fffaf7;
      text-align: center;
    }

    .modal-fechar {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: #c59aa1;
      font-size: 22px;
      cursor: pointer;
    }

    .modal-icone {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .modal-titulo {
      margin-bottom: 8px;
      color: #9d7079;
      font-size: 15px;
    }

    .modal-texto {
      margin-bottom: 20px;
      color: #a17d84;
      font-size: 12px;
      line-height: 1.6;

    .modal-play {

      height: 70px;
      margin-bottom: 18px;
      border: none;
      border-radius: 50%;
      background: #ce8c98;
      color: white;

      cursor: pointer;

      right: 18px;
      bottom: 22px;
      z-index: 7000;

      height: 58px;

      border-radius: 50%;

      border: none;
      background: transparent;
      color: #c3a1a6;
      font-size: 9px;
      cursor: pointer;
    }

    .rodape {
      margin-top: 70px;
      color: #bea0a5;
      font-size: .6rem;
      letter-spacing: 2px;
    }

  </style>

</head>

    /* ============================================

    ============================================ */

    window.onYouTubeIframeAPIReady =
      function() {

        player =
          new YT.Player(
            "player",
            {

              videoId:
                musicaInicial.video,

              playerVars: {
                playsinline: 1,
                controls: 0,
                rel: 0
              },

              events: {

                onReady:
                  function() {

                    playerPronto =
                      true;

                    document
                      .getElementById("play")
                      .disabled =
                      false;

                    document
                      .getElementById("status")
                      .textContent =
                      "toque para ouvir";

                  },

                onStateChange:
                  function(event) {

                    tocando =
                      event.data ===
                      YT.PlayerState.PLAYING;

                    document
                      .getElementById("play")
                      .textContent =
                      tocando
                        ? "❚❚"
                        : "▶";

                  }

              }

            }
          );

      };


    document
      .getElementById("play")
      .addEventListener(
        "click",
        function() {

          if (!playerPronto) {
            return;
          }

          if (tocando) {

            player.pauseVideo();

          }

          else {

            player.seekTo(
              musicaNoPlayer.inicio,
              true
            );

            player.playVideo();

          }

        }
      );



    /* ============================================
       TOAST
    ============================================ */

    function mostrarToast(texto) {

      const container =
        document.getElementById(
          "toastContainer"
        );

      container.innerHTML =
        "";

      const toast =
        document.createElement(
          "div"
        );

      toast.className =
        "toast";

      toast.textContent =
        "♡  " + texto;

      container.appendChild(
        toast
      );

      setTimeout(
        function() {

          if (
            toast.isConnected
          ) {

            toast.remove();

          }

        },
        5000
      );

    }



    /* ============================================
       QUIZ
    ============================================ */

    function validarQuiz() {

      const valor =
        normalizar(
          document
            .getElementById("resposta")
            .value
        );

      const corretas =
        musicaInicial
          .respostas
          .map(normalizar);


      if (
        corretas.includes(
          valor
        )
      ) {

        if (player) {

          player.pauseVideo();

        }

        document
          .getElementById("entrada")
          .style.display =
          "none";

        document
          .getElementById("areaPrincipal")
          .style.display =
          "block";

        iniciarEventos();

        verificarSessao();

      }

      else {

        document
          .getElementById("mensagemQuiz")
          .textContent =
          "tente outra vez ♫";

      }

    }


    document
      .getElementById("entrar")
      .addEventListener(
        "click",
        validarQuiz
      );


    document
      .getElementById("resposta")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            validarQuiz();

          }

        }
      );



    /* ============================================
       EVENTOS
    ============================================ */

      false;

    let contadorBuscas =
      0;

      if (eventosIniciados) {
        return;
      }

      eventosIniciados =

    /* ============================================
       MODAL
    ============================================ */

    function abrirModal(
      icone,
      titulo,
      texto
    ) {

      document
        .getElementById(
          "modalIcone"
        )
        .textContent =
        icone;

      document
        .getElementById(
          "modalTitulo"
        )
        .textContent =
        titulo;

      document
        .getElementById(
          "modalTexto"
        )
        .textContent =
        texto;

      document
        .getElementById(
          "conteudoModal"
        )
        .innerHTML =
        "";

      document
        .getElementById(
          "modalFundo"
        )
        .classList
        .add(
          "aberto"
        );

    }


    function fecharModal() {

      document
        .getElementById(
          "modalFundo"
        )
        .classList
        .remove(
          "aberto"
        );

    }


    document
      .getElementById(
        "fecharModal"
      )
      .addEventListener(
        "click",
        fecharModal
      );



    /* ============================================
       JOGO SIMPLES
    ============================================ */

    function iniciarDesafio() {

      const musica =
        sorteio(musicas);

      musicaNoPlayer =
        musica;


      player.loadVideoById({
        videoId:
          musica.video,

        startSeconds:
          musica.inicio
      });

      player.pauseVideo();


      abrirModal(
        "🎧",
        "emergência musical",
        "quem está tocando?"
      );


      const conteudo =
        document.getElementById(
          "conteudoModal"
        );


      const play =
        document.createElement(
          "button"
        );

      play.className =
        "modal-play";

      play.type =
        "button";

      play.textContent =
        "▶";


      const input =
        document.createElement(
          "input"
        );

      input.className =
        "campo";

      input.placeholder =
        "sua resposta...";


      const responder =
        document.createElement(
          "button"
        );

      responder.className =
        "botao";

      responder.type =
        "button";

      responder.textContent =
        "responder";


      conteudo.appendChild(
        play
      );

      conteudo.appendChild(
        input
      );

      conteudo.appendChild(
        responder
      );


      play.addEventListener(
        "click",
        function() {

          player.seekTo(
            musica.inicio,
            true
          );

          player.playVideo();

        }
      );


      responder.addEventListener(
        "click",
        function() {

          const valor =
            normalizar(
              input.value
            );

          const corretas =
            musica
              .respostas
              .map(normalizar);


          if (
            corretas.includes(
              valor
            )
          ) {

            mostrarToast(
              "óbvio que você sabia ♡"
            );

          }

          else {

            mostrarToast(
              "era " +
              musica.artista +
              " 👀"
            );

          }

          player.pauseVideo();

          fecharModal();

        }
      );

    }


    document
      .getElementById(
        "jogarAgora"
      )
      .addEventListener(
        "click",
        iniciarDesafio
      );


    document
      .getElementById(
        "surpresaAgora"
      )
      .addEventListener(
        "click",
        function() {

          mostrarToast(
            sorteio([
              "algumas fotos deveriam continuar esquecidas 😂",
              "memórias desbloqueadas.",
              "isso está ficando suspeito 👀",
              "mais fotos. claro.",
              "sweet little stalker ♡"
            ])
          );

        }
      );


    document
      .getElementById(
        "coracaoSurpresa"
      )
      .addEventListener(
        "click",
        function() {

          this.style.display =
            "none";

          abrirModal(
            "♡",
            "você encontrou",
            "esse coração estava esperando você."
          );

        }
      );


    document
      .getElementById(
        "naoClique"
      )
      .addEventListener(
        "click",
        function() {

          abrirModal(
            "😈",
            "eu literalmente avisei.",
            "mas é claro que você clicou."
          );

        }
      );



    /* ============================================
       ADMIN
    ============================================ */

    document
      .getElementById(
        "abrirAdmin"
      )
      .addEventListener(
        "click",
        function() {

          const painel =
            document.getElementById(
              "painelAdmin"
            );

          painel.style.display =
            painel.style.display ===
            "block"
              ? "none"
              : "block";

        }
      );


    async function login() {

      const email =
        document
          .getElementById(
            "adminEmail"
          )
          .value
          .trim();

      const senha =
        document
          .getElementById(
            "adminSenha"
          )
          .value;


      const {
        error
      } =
        await db.auth
          .signInWithPassword({
            email: email,
            password: senha
          });


      if (error) {

        document
          .getElementById(
            "mensagemAdmin"
          )
          .textContent =
          "não foi possível entrar";

        return;

      }


      adminLogado =
        true;

      mostrarUpload();

      mostrarToast(
        "modo admin ativado"
      );

    }


    document
      .getElementById(
        "botaoLogin"
      )
      .addEventListener(
        "click",
        login
      );


    function mostrarUpload() {

      adminLogado =
        true;

      document
        .getElementById(
          "loginAdmin"
        )
        .style.display =
        "none";

      document
        .getElementById(
          "formUpload"
        )
        .style.display =
        "block";

      document
        .getElementById(
          "mensagemAdmin"
        )
        .textContent =
        "admin conectado ♡";

    }


    async function verificarSessao() {

      const {
        data
      } =
        await db.auth
          .getSession();


      adminLogado =
        Boolean(
          data &&
          data.session
        );


      if (adminLogado) {

        mostrarUpload();

      }

    }


    document
      .getElementById(
        "logout"
      )
      .addEventListener(
        "click",
        async function() {

          await db.auth.signOut();

          adminLogado =
            false;

          document
            .getElementById(
              "formUpload"
            )
            .style.display =
            "none";

          document
            .getElementById(
              "loginAdmin"
            )
            .style.display =
            "block";

          document
            .getElementById(
              "resultado"
            )
            .innerHTML =
            "";

        }
      );



    /* ============================================
       PREVIEW
    ============================================ */

    const inputArquivo =
      document.getElementById(
        "arquivoFoto"
      );


    inputArquivo.addEventListener(
      "change",
      function() {

        const arquivo =
          this.files &&
          this.files[0];


        if (!arquivo) {
          return;
        }


        const url =
          URL.createObjectURL(
            arquivo
          );


        const preview =
          document.getElementById(
            "preview"
          );


        preview.src =
          url;

        preview.style.display =
          "block";


        preview.onload =
          function() {

            URL.revokeObjectURL(
              url
            );

          };

      }
    );



    /* ============================================
       UPLOAD
    ============================================ */

    async function salvarFoto() {

      const arquivo =
        inputArquivo.files &&
        inputArquivo.files[0];

      const tag1 =
        normalizar(
          document
            .getElementById("tag1")
            .value
        );

      const tag2 =
        normalizar(
          document
            .getElementById("tag2")
            .value
        );

      const tag3 =
        normalizar(
          document
            .getElementById("tag3")
            .value
        );


      if (
        !arquivo ||
        !tag1 ||
        !tag2 ||
        !tag3
      ) {

        document
          .getElementById(
            "mensagemAdmin"
          )
          .textContent =
          "escolha a foto e preencha as 3 tags";

        return;

      }


      const extensao =
        arquivo.name
          .split(".")
          .pop()
          .toLowerCase();


      const nomeArquivo =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,10) +
        "." +
        extensao;


      const {
        error:
          erroUpload
      } =
        await db.storage
          .from(BUCKET)
          .upload(
            nomeArquivo,
            arquivo
          );


      if (erroUpload) {

        document
          .getElementById(
            "mensagemAdmin"
          )
          .textContent =
          "erro ao enviar a foto";

        return;

      }


      const {
        error:
          erroBanco
      } =
        await db
          .from("fotos")
          .insert({
            arquivo:
              nomeArquivo,
            tag1:
              tag1,
            tag2:
              tag2,
            tag3:
              tag3
          });


      if (erroBanco) {

        document
          .getElementById(
            "mensagemAdmin"
          )
          .textContent =
          "erro ao salvar as tags";

        return;

      }


      document
        .getElementById(
          "mensagemAdmin"
        )
        .textContent =
        "foto salva ♡";


      mostrarToast(
        "nova lembrança guardada ♡"
      );


      inputArquivo.value =
        "";

      document
        .getElementById("tag1")
        .value =
        "";

      document
        .getElementById("tag2")
        .value =
        "";

      document
        .getElementById("tag3")
        .value =
        "";

      document
        .getElementById("preview")
        .style.display =
        "none";

    }


    document
      .getElementById(
        "salvarFoto"
      )
      .addEventListener(
        "click",
        salvarFoto
      );



    /* ============================================
       EXCLUIR FOTO
    ============================================ */

    async function excluirFoto(
      foto,
      card,
      botao
    ) {

      if (!adminLogado) {

        mostrarToast(
          "somente o admin pode excluir"
        );

        return;

      }


      const confirmar =
        window.confirm(
          "Apagar esta foto definitivamente?"
        );


      if (!confirmar) {
        return;
      }


      botao.disabled =
        true;

      botao.textContent =
        "excluindo...";


      /*
        PRIMEIRO APAGA O ARQUIVO
        DO STORAGE
      */

      const {
        error:
          erroStorage
      } =
        await db.storage
          .from(BUCKET)
          .remove([
            foto.arquivo
          ]);


      if (erroStorage) {

        console.error(
          erroStorage
        );

        botao.disabled =
          false;

        botao.textContent =
          "🗑 excluir";

        mostrarToast(
          "não foi possível apagar a imagem"
        );

        return;

      }


      /*
        DEPOIS APAGA O REGISTRO
        DA TABELA
      */

      const {
        error:
          erroTabela
      } =
        await db
          .from("fotos")
          .delete()
          .eq(
            "id",
            foto.id
          );


      if (erroTabela) {

        console.error(
          erroTabela
        );

        botao.disabled =
          false;

        botao.textContent =
          "🗑 excluir";

        mostrarToast(
          "imagem apagada, mas houve erro no registro"
        );

        return;

      }


      /*
        REMOVE DA TELA
      */

      card.remove();


      mostrarToast(
        "foto apagada definitivamente"
      );


      const resultado =
        document.getElementById(
          "resultado"
        );


      if (
        resultado.children.length ===
        0
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>nenhuma lembrança encontrada ♡</div>";

      }

    }



    /* ============================================
       BUSCA
    ============================================ */

    async function buscar() {

      const termo =
        normalizar(
          document
            .getElementById(
              "busca"
            )
            .value
        );


      if (!termo) {
        return;
      }


      contadorBuscas++;


      if (
        contadorBuscas === 3
      ) {

        mostrarToast(
          "já é a terceira busca 👀"
        );

      }


      const {
        data:
          sessao
      } =
        await db.auth
          .getSession();


      adminLogado =
        Boolean(
          sessao &&
          sessao.session
        );


      const resultado =
        document.getElementById(
          "resultado"
        );


      if (!adminLogado) {

        resultado.innerHTML =
          "<div class='mensagem'>as fotos ainda estão em modo privado ♡</div>";

        return;

      }


      resultado.innerHTML =
        "<div class='mensagem'>procurando...</div>";


      const {
        data:
          fotos,
        error
      } =
        await db
          .from("fotos")
          .select("*")
          .or(
            "tag1.eq." +
            termo +
            ",tag2.eq." +
            termo +
            ",tag3.eq." +
            termo
          )
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (error) {

        console.error(
          error
        );

        resultado.innerHTML =
          "<div class='mensagem'>erro na busca</div>";

        return;

      }


      if (
        !fotos ||
        fotos.length === 0
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>nenhuma lembrança encontrada ♡</div>";

        return;

      }


      resultado.innerHTML =
        "";


      for (
        const foto of fotos
      ) {

        const {
          data:
            assinatura,
          error:
            erroUrl
        } =
          await db.storage
            .from(BUCKET)
            .createSignedUrl(
              foto.arquivo,
              600
            );


        if (
          erroUrl ||
          !assinatura ||
          !assinatura.signedUrl
        ) {

          continue;

        }


        const card =
          document.createElement(
            "article"
          );

        card.className =
          "foto-card";


        const imagem =
          document.createElement(
            "img"
          );

        imagem.src =
          assinatura.signedUrl;

        imagem.alt =
          "lembrança";

        imagem.loading =
          "lazy";


        const tags =
          document.createElement(
            "div"
          );

        tags.className =
          "tags";


        [
          foto.tag1,
          foto.tag2,
          foto.tag3
        ].forEach(
          function(texto) {

            const tag =
              document.createElement(
                "span"
              );

            tag.className =
              "tag";

            tag.textContent =
              texto;

            tags.appendChild(
              tag
            );

          }
        );


        card.appendChild(
          imagem
        );

        card.appendChild(
          tags
        );


        /*
          BOTÃO EXCLUIR
          SOMENTE ADMIN
        */

        if (adminLogado) {

          const areaExcluir =
            document.createElement(
              "div"
            );

          areaExcluir.className =
            "area-excluir";


          const botaoExcluir =
            document.createElement(
              "button"
            );

          botaoExcluir.type =
            "button";

          botaoExcluir.className =
            "botao-excluir visivel";

          botaoExcluir.textContent =
            "🗑 excluir";


          botaoExcluir.addEventListener(
            "click",
            function() {

              excluirFoto(
                foto,
                card,
                botaoExcluir
              );

            }
          );


          areaExcluir.appendChild(
            botaoExcluir
          );


          card.appendChild(
            areaExcluir
          );

        }


        resultado.appendChild(
          card
        );

      }

    }


    document
      .getElementById(
        "botaoBuscar"
      )
      .addEventListener(
        "click",
        buscar
      );


    document
      .getElementById(
        "busca"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            buscar();

          }

        }
      );


  </script>
