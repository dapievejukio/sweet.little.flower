<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>sweet.little.flower</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #fff9f5 0%,
      #f7e9e3 50%,
      #ead6d1 100%
    );

  color: #72565b;
}

.pagina {
  width: 88%;
  max-width: 430px;

  margin: auto;

  padding-top: 11vh;

  text-align: center;
}


/* LOGO */

.logo {
  font-size: 1.8rem;

  font-weight: 300;

  letter-spacing: 3px;

  color: #bc7e89;
}

.coracao {
  margin-top: 12px;
  margin-bottom: 50px;

  color: #d49ca6;

  font-size: 1.2rem;
}


/* PERGUNTA */

.pergunta {
  margin-bottom: 28px;

  font-size: .72rem;

  letter-spacing: 3px;

  color: #9f767d;
}


/* PLAY */

.play {
  width: 82px;
  height: 82px;

  border: none;
  border-radius: 50%;

  background: #ce8c98;

  color: white;

  font-size: 1.5rem;

  cursor: pointer;

  box-shadow:
    0 10px 30px
    rgba(143,87,98,.22);

  transition: .2s;
}

.play:active {
  transform: scale(.94);
}

.play:disabled {
  opacity: .45;

  cursor: default;
}


/* STATUS */

.ouvir {
  display: block;

  margin-top: 14px;
  margin-bottom: 32px;

  font-size: .65rem;

  letter-spacing: 2px;

  color: #ae898f;
}


/* INPUT */

.campo {
  width: 100%;

  padding: 17px 20px;

  border: 1px solid #e2c9c6;
  border-radius: 40px;

  outline: none;

  background: #fffaf7;

  color: #71555a;

  text-align: center;

  font-size: 16px;
}

.campo::placeholder {
  color: #bea2a7;
}


/* ENTRAR */

.entrar {
  width: 100%;

  margin-top: 14px;

  padding: 16px;

  border: none;
  border-radius: 40px;

  background: #c68591;

  color: white;

  font-size: .78rem;

  letter-spacing: 2px;

  cursor: pointer;
}


/* MENSAGEM */

.mensagem {
  min-height: 35px;

  padding-top: 16px;

  color: #ae737e;

  font-size: .75rem;
}


/* CRÉDITO */

.credito {
  margin-top: 18px;

  font-size: 10px;

  color: #b99b9f;
}

.credito a {
  color: #a97e85;

  text-decoration: none;
}


/* CONTEÚDO */

#conteudo {
  display: none;

  animation:
    aparecer .7s ease;
}

@keyframes aparecer {

  from {
    opacity: 0;

    transform:
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}


.liberado {
  margin-bottom: 30px;

  font-size: .7rem;

  letter-spacing: 2px;

  color: #a67c83;
}


/* BUSCADOR */

.buscador {
  display: flex;

  padding: 6px;

  background: #fffaf7;

  border:
    1px solid #e5ceca;

  border-radius: 40px;

  box-shadow:
    0 8px 25px
    rgba(110,75,82,.08);
}


#busca {
  min-width: 0;

  flex: 1;

  padding: 12px 15px;

  border: none;

  outline: none;

  background: transparent;

  color: #75585d;

  font-size: 16px;
}


#busca::placeholder {
  color: #bea3a7;
}


.buscar {
  width: 46px;
  height: 46px;

  border: none;
  border-radius: 50%;

  background: #d3939e;

  color: white;

  cursor: pointer;
}


#resultado {
  margin-top: 35px;
}


/* YOUTUBE */

.youtube-container {
  width: 200px;
  height: 200px;

  position: fixed;

  left: 0;
  bottom: 0;

  opacity: .001;

  overflow: hidden;

  pointer-events: none;

  z-index: -1;
}


#player {
  width: 200px;
  height: 200px;
}


/* RODAPÉ */

.rodape {
  margin-top: 80px;

  color: #bea0a5;

  font-size: .6rem;

  letter-spacing: 2px;
}


@media (max-width: 500px) {

  .pagina {
    padding-top: 11vh;
  }

  .logo {
    font-size: 1.55rem;
  }

}

</style>
</head>


<body>


<main class="pagina">


  <div class="logo">
    sweet.little.flower
  </div>


  <div class="coracao">
    ♡
  </div>



  <!-- ENTRADA -->

  <section id="entrada">


    <div class="pergunta">
      quem está tocando?
    </div>


    <button
      id="play"
      class="play"
      disabled
      aria-label="Tocar música"
    >
      ▶
    </button>


    <span
      id="status"
      class="ouvir"
    >
      preparando música...
    </span>


    <input
      id="resposta"
      class="campo"
      type="text"
      placeholder="sua resposta..."
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >


    <button
      id="entrar"
      class="entrar"
    >
      entrar
    </button>


    <div
      id="mensagem"
      class="mensagem"
    ></div>


    <div class="credito">

      música via

      <a
        id="linkYoutube"
        href="https://youtube.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

    </div>


  </section>



  <!-- ÁREA LIBERADA -->

  <section id="conteudo">


    <div class="liberado">
      ♡ encontre sua lembrança
    </div>


    <div class="buscador">


      <input
        id="busca"
        type="text"
        placeholder="buscar..."
        autocomplete="off"
        autocapitalize="none"
      >


      <button
        id="botaoBuscar"
        class="buscar"
        aria-label="Buscar"
      >
        ♡
      </button>


    </div>


    <div id="resultado"></div>


  </section>



  <div class="rodape">
    sweet.little.flower
  </div>


</main>



<!-- PLAYER YOUTUBE -->

<div class="youtube-container">

  <div id="player"></div>

</div>



<script src="https://www.youtube.com/iframe_api"></script>


<script>

/*
================================================
ARTISTAS
================================================
*/

const artistas = [

  {

    artista: "Måneskin",

    video:
      "HZnNt9nnEhw",

    inicio: 25,

    respostas: [
      "maneskin",
      "måneskin"
    ]

  },


  {

    artista: "Damiano David",

    video:
      "BD8jIlBA1nA",

    inicio: 25,

    respostas: [
      "damiano",
      "damiano david"
    ]

  },


  {

    artista: "ILLIT",

    video:
      "Vk5-c_v4gMU",

    inicio: 28,

    respostas: [
      "illit"
    ]

  },


  {

    artista: "BLACKPINK",

    video:
      "gQlMMD8auMs",

    inicio: 30,

    respostas: [
      "blackpink",
      "black pink"
    ]

  },


  {

    artista: "Mamonas Assassinas",

    video:
      "Nz7101ulkK0",

    inicio: 30,

    respostas: [
      "mamonas",
      "mamonas assassinas"
    ]

  }

];



/*
================================================
SORTEIO
================================================
*/

let indiceAtual =
  Math.floor(
    Math.random() *
    artistas.length
  );


let musicaAtual =
  artistas[indiceAtual];



/*
================================================
ELEMENTOS
================================================
*/

const botaoPlay =
  document.getElementById(
    "play"
  );


const status =
  document.getElementById(
    "status"
  );


const mensagem =
  document.getElementById(
    "mensagem"
  );


const resposta =
  document.getElementById(
    "resposta"
  );


const entrada =
  document.getElementById(
    "entrada"
  );


const conteudo =
  document.getElementById(
    "conteudo"
  );


const linkYoutube =
  document.getElementById(
    "linkYoutube"
  );



let player;

let pronto =
  false;

let tocando =
  false;



/*
================================================
ATUALIZAR LINK
================================================
*/

function atualizarLink() {

  linkYoutube.href =
    "https://www.youtube.com/watch?v=" +
    musicaAtual.video;

}


atualizarLink();



/*
================================================
CRIAR PLAYER
================================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        width:
          "200",

        height:
          "200",

        videoId:
          musicaAtual.video,

        playerVars: {

          playsinline: 1,

          controls: 0,

          rel: 0,

          start:
            musicaAtual.inicio,

          origin:
            window.location.origin

        },

        events: {

          onReady:
            playerPronto,

          onStateChange:
            mudouEstado,

          onError:
            erroPlayer

        }

      }
    );

}



/*
================================================
PLAYER PRONTO
================================================
*/

function playerPronto() {

  pronto =
    true;


  botaoPlay.disabled =
    false;


  status.textContent =
    "toque para ouvir";


  mensagem.textContent =
    "";

}



/*
================================================
PLAY
================================================
*/

botaoPlay.addEventListener(
  "click",

  function() {

    if (!pronto) {

      mensagem.textContent =
        "a música ainda está carregando ♫";

      return;

    }


    if (tocando) {

      player.pauseVideo();

    }

    else {

      player.playVideo();

    }

  }
);



/*
================================================
ESTADO PLAYER
================================================
*/

function mudouEstado(event) {


  if (
    event.data ===
    YT.PlayerState.PLAYING
  ) {

    tocando =
      true;


    botaoPlay.textContent =
      "❚❚";


    mensagem.textContent =
      "";

  }



  if (
    event.data ===
    YT.PlayerState.PAUSED
  ) {

    tocando =
      false;


    botaoPlay.textContent =
      "▶";

  }



  if (
    event.data ===
    YT.PlayerState.ENDED
  ) {

    tocando =
      false;


    botaoPlay.textContent =
      "▶";


    player.seekTo(
      musicaAtual.inicio,
      true
    );

  }

}



/*
================================================
SE ALGUM VÍDEO DER ERRO
================================================
*/

function erroPlayer() {

  mensagem.textContent =
    "trocando música... ♫";


  pronto =
    false;


  botaoPlay.disabled =
    true;


  indiceAtual =
    (indiceAtual + 1) %
    artistas.length;


  musicaAtual =
    artistas[indiceAtual];


  atualizarLink();


  setTimeout(
    function() {

      player.loadVideoById({

        videoId:
          musicaAtual.video,

        startSeconds:
          musicaAtual.inicio

      });


      pronto =
        true;


      botaoPlay.disabled =
        false;


      status.textContent =
        "toque para ouvir";


      mensagem.textContent =
        "";

    },

    800
  );

}



/*
================================================
NORMALIZAR
================================================
*/

function normalizar(texto) {

  return texto
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}



/*
================================================
VALIDAR RESPOSTA
================================================
*/

function validar() {


  const tentativa =
    normalizar(
      resposta.value
    );


  const corretas =
    musicaAtual.respostas.map(
      normalizar
    );


  if (
    corretas.includes(
      tentativa
    )
  ) {


    if (player) {

      player.pauseVideo();

    }


    entrada.style.display =
      "none";


    conteudo.style.display =
      "block";


    return;

  }



  mensagem.textContent =
    "tente outra vez ♫";


  resposta.value =
    "";


  resposta.focus();

}



/*
================================================
BOTÃO ENTRAR
================================================
*/

document
  .getElementById(
    "entrar"
  )
  .addEventListener(
    "click",
    validar
  );



/*
================================================
ENTER
================================================
*/

resposta.addEventListener(
  "keydown",

  function(event) {

    if (
      event.key === "Enter"
    ) {

      validar();

    }

  }
);



/*
================================================
FOTOS
================================================

Depois cadastraremos:

comando
arquivo
legenda

================================================
*/

const fotos = [

];



/*
================================================
BUSCAR FOTO
================================================
*/

function buscarFoto() {


  const campo =
    document.getElementById(
      "busca"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  const comando =
    normalizar(
      campo.value
    );


  resultado.innerHTML =
    "";


  if (!comando) {

    return;

  }



  const foto =
    fotos.find(

      item =>

        normalizar(
          item.comando
        )

        === comando

    );



  if (!foto) {

    resultado.innerHTML = `

      <div
        style="
          font-size:18px;
          color:#c69ca3;
        "
      >

        ♡

      </div>

    `;

    return;

  }



  resultado.innerHTML = `

    <div>

      <img
        src="${foto.arquivo}"
        alt=""
        style="
          width:100%;
          border-radius:20px;
          box-shadow:
            0 10px 30px
            rgba(100,70,75,.12);
        "
      >

      <div
        style="
          margin-top:14px;
          font-size:13px;
          color:#96747a;
        "
      >

        ${foto.legenda}

      </div>

    </div>

  `;

}



/*
================================================
BOTÃO BUSCAR
================================================
*/

document
  .getElementById(
    "botaoBuscar"
  )
  .addEventListener(
    "click",
    buscarFoto
  );



/*
================================================
ENTER BUSCA
================================================
*/

document
  .getElementById(
    "busca"
  )
  .addEventListener(
    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        buscarFoto();

      }

    }
  );


</script>

</body>
</html>
