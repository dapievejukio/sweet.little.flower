<!DOCTYPE html>
<html lang="pt-BR">

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #fff9f5 0%,
          #f7e9e3 50%,
          #ead6d1 100%
        );

      color: #72565b;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .pagina {
      width: 88%;
      max-width: 430px;

      margin: auto;

      padding-top: 8vh;
      padding-bottom: 60px;

      text-align: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 3px;

      color: #bc7e89;
    }

    .coracao-topo {
      margin-top: 12px;
      margin-bottom: 42px;

      color: #d49ca6;

      font-size: 1.2rem;
    }

    .pergunta {
      margin-bottom: 12px;

      font-size: .72rem;
      letter-spacing: 3px;

      color: #9f767d;
    }

    .modo-quiz {
      min-height: 30px;

      margin-bottom: 18px;

      color: #bc8b94;

      font-size: 11px;
      letter-spacing: 1px;
    }

    .play {
      width: 82px;
      height: 82px;

      border: none;
      border-radius: 50%;

      background: #ce8c98;
      color: white;

      font-size: 1.5rem;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(143, 87, 98, .22);

      transition:
        transform .15s ease;
    }

    .play:active {
      transform: scale(.94);
    }

    .play:disabled {
      opacity: .45;
    }

    .ouvir {
      display: block;

      margin-top: 14px;
      margin-bottom: 30px;

      font-size: .65rem;
      letter-spacing: 2px;

      color: #ae898f;
    }

    .campo {
      width: 100%;

      padding: 17px 20px;

      margin-bottom: 12px;

      border: 1px solid #e2c9c6;
      border-radius: 40px;

      outline: none;

      background: #fffaf7;

      color: #71555a;

      text-align: center;

      font-size: 16px;
    }

    .campo:focus {
      border-color: #c98b96;
    }

    .campo::placeholder {
      color: #bea2a7;
    }

    .botao {
      width: 100%;

      padding: 16px;

      margin-top: 3px;

      border: none;
      border-radius: 40px;

      background: #c68591;
      color: white;

      font-size: .78rem;
      letter-spacing: 2px;

      cursor: pointer;
    }

    .botao:disabled {
      opacity: .5;
      cursor: default;
    }

    .botao-secundario {
      margin-top: 10px;

      background: #fffaf7;

      color: #a97c84;

      border: 1px solid #e3cac7;
    }

    .mensagem {
      min-height: 35px;

      padding-top: 15px;

      color: #ae737e;

      font-size: .75rem;
      line-height: 1.5;
    }

    .credito {
      margin-top: 15px;

      font-size: 10px;

      color: #b99b9f;
    }

    #areaPrincipal,
    #painelAdmin,
    #formUpload {
      display: none;
    }

    .subtitulo {
      margin-bottom: 25px;

      font-size: .72rem;
      letter-spacing: 2px;

      color: #a67c83;
    }

    .buscador {
      display: flex;

      padding: 6px;

      background: #fffaf7;

      border: 1px solid #e5ceca;
      border-radius: 40px;

      box-shadow:
        0 8px 25px
        rgba(110, 75, 82, .08);
    }

    #busca {
      min-width: 0;
      flex: 1;

      padding: 12px 15px;

      border: none;
      outline: none;

      background: transparent;

      color: #75585d;

      font-size: 16px;
    }

    .buscar {
      flex: 0 0 46px;

      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: #d3939e;
      color: white;

      cursor: pointer;
    }

    .acoes-principais {
      display: flex;
      gap: 8px;

      margin-top: 17px;
    }

    .acao-mini {
      flex: 1;

      min-height: 44px;

      padding: 10px;

      border:
        1px solid #e3cac7;

      border-radius: 30px;

      background:
        rgba(255,250,247,.72);

      color: #aa7e86;

      font-size: 10px;
      letter-spacing: .5px;

      cursor: pointer;
    }

    .linha-admin {
      margin-top: 15px;
    }

    .admin-link {
      padding: 10px;

      border: none;

      background: transparent;

      color: #b28b91;

      font-size: 11px;
      letter-spacing: 1px;

      cursor: pointer;
    }

    .caixa {
      margin-top: 28px;

      padding: 25px 18px;

      border-radius: 25px;

      background:
        rgba(255, 250, 247, .72);

      border:
        1px solid #e5cfcb;
    }

    .caixa h2 {
      margin-bottom: 22px;

      color: #9d777e;

      font-size: .75rem;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .upload-area {
      display: block;

      width: 100%;

      padding: 25px 15px;

      margin-bottom: 18px;

      border:
        1px dashed #d6afb5;

      border-radius: 22px;

      background: #fffaf7;

      color: #ae8189;

      cursor: pointer;
    }

    #arquivoFoto {
      display: none;
    }

    #preview {
      display: none;

      width: 100%;
      max-height: 340px;

      margin-bottom: 18px;

      object-fit: contain;

      border-radius: 20px;

      background: #f6e9e5;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 12px;
    }

    .tag {
      padding: 6px 11px;

      background: #f0dadd;

      border-radius: 20px;

      color: #916d74;

      font-size: 11px;
    }

    #resultado {
      margin-top: 30px;
    }

    .foto-card {
      margin-bottom: 30px;

      text-align: left;

      animation:
        aparecer .45s ease;
    }

    .foto-card img {
      display: block;

      width: 100%;

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(95, 65, 72, .13);
    }

    @keyframes aparecer {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .youtube-container {
      position: fixed;

      left: 0;
      bottom: 0;

      width: 200px;
      height: 200px;

      opacity: .001;

      overflow: hidden;

      pointer-events: none;

      z-index: -1;
    }

    #player {

      height: 200px;
    }

    .rodape {
      margin-top: 70px;

      color: #bea0a5;

      font-size: .6rem;
      letter-spacing: 2px;
    }


    /* ==========================================
       TOAST
    ========================================== */

    #toastContainer {
      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 390px;

      z-index: 9999;

      pointer-events: none;
    }

    .toast {
      position: relative;

      padding:
        16px 42px
        16px 18px;

      border:
        1px solid #e5c9cc;

      border-radius: 20px;

      background:
        rgba(255,250,247,.98);

      color: #8d6870;

      font-size: 13px;
      line-height: 1.45;

      text-align: left;

      box-shadow:
        0 12px 35px
        rgba(102,68,75,.15);

      opacity: 0;

      transform:
        translateY(-25px);

      transition:
        opacity .35s ease,
        transform .35s ease;
    }

    .toast.visivel {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.saindo {
      opacity: 0;
      transform: translateY(-18px);
    }

    .toast-coracao {
      margin-right: 7px;

      color: #cf929d;
    }

    .toast-fechar {
      position: absolute;

      top: 50%;
      right: 12px;

      width: 30px;
      height: 30px;

      transform:
        translateY(-50%);

      border: none;

      background: transparent;

      color: #c59aa1;

      font-size: 19px;

      cursor: pointer;

      pointer-events: auto;
    }


    /* ==========================================
       MODAL / JOGOS
    ========================================== */

    #modalFundo {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 8000;

      padding: 20px;

      align-items: center;
      justify-content: center;

      background:
        rgba(92,65,70,.36);

      backdrop-filter:
        blur(6px);
    }

    #modalFundo.aberto {
      display: flex;
    }

    .modal {
      position: relative;

      width: 100%;
      max-width: 390px;

      padding: 28px 20px;

      border:
        1px solid #e5c9cc;

      border-radius: 28px;

      background:
        #fffaf7;

      box-shadow:

    .modal-titulo {

      line-height: 1.6;

      right: 12px;

      width: 38px;
      height: 38px;

      border: none;

      background: transparent;

      color: #c59aa1;

      font-size: 22px;

      cursor: pointer;
    }

    .modal-play {

      height: 70px;

      margin-bottom: 18px;

      border: none;
      border-radius: 50%;

      background: #ce8c98;
      color: white;

      font-size: 21px;

    .modal-botoes {

      gap: 8px;

    ========================================== */

      height: 58px;

      border: none;
      border-radius: 50%;

      font-size: 24px;

      box-shadow:

      cursor: pointer;

      animation:
        pulsar 1.3s infinite;
    }

    @keyframes pulsar {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {

      }

      background: transparent;

      letter-spacing: 1px;

    @media (max-width: 480px) {

        width: 90%;

        padding-top: 7vh;
      }

      .logo {

        letter-spacing: 2.5px;

        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }

      const copia =
        [...lista];

      for (
        let i =
          copia.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          copia[i],
          copia[j]
        ] =
        [
          copia[j],
          copia[i]
        ];

      musicaNoPlayer =
        musica;

      player.loadVideoById({
        videoId:
          musica.video,

        startSeconds:
          musica.inicio

      if (!tocar) {

        player.pauseVideo();

      }

    }

              musicaNoPlayer.inicio,
              true
            );

            player.playVideo();

    function fecharToast(
      toast
    ) {

      if (
        !toast ||
        !toast.isConnected
      ) {

        return;

      }

      toast.classList.remove(
        "visivel"
      );

      toast.classList.add(
        "saindo"
      );

      setTimeout(
        function() {

          if (
            toast.isConnected
          ) {

            toast.remove();

          }

        },
        350
      );

    }


    function mostrarToast(
      texto
    ) {

      const container =
        document.getElementById(
          "toastContainer"
        );

      container.innerHTML =
        "";

      const toast =
        document.createElement(
          "div"
        );

      toast.className =
        "toast";


      const coracao =
        document.createElement(
          "span"
        );

      coracao.className =
        "toast-coracao";

      coracao.textContent =
        "♡";


      const mensagem =
        document.createElement(
          "span"
        );

      mensagem.textContent =
        texto;


      const fechar =
        document.createElement(
          "button"
        );

      fechar.className =
        "toast-fechar";

      fechar.type =
        "button";

      fechar.textContent =
        "×";


      toast.appendChild(
        coracao
      );

      toast.appendChild(
        mensagem
      );

      toast.appendChild(
        fechar
      );

      container.appendChild(
        toast
      );


      fechar.addEventListener(
        "click",
        function() {

          fecharToast(
            toast
          );

        }
      );


      requestAnimationFrame(
        function() {

          requestAnimationFrame(
            function() {

              toast.classList.add(
                "visivel"
              );

            }
          );

        }
      );


      setTimeout(
        function() {

          fecharToast(
            toast
          );

        },
        5000
      );

    }

      function responderRodada() {

        const resposta =

          .getElementById(

          )

          .value =
          "";

        document

          )
          .style.display =
          "none";

        contadorBuscas === 5
      ) {

        mostrarToast(
          "curiosa demais hoje, não?"
        );

      }

      else if (
        contadorBuscas === 8
      ) {

        mostrarToast(
          "o mundo lá fora ainda existe 🌸"
        );

      }

      else if (
        contadorBuscas === 10
      ) {

        mostrarCoracao();

      }


      const resultado =
        document.getElementById(
          "resultado"
        );


      const {
        data:
          sessao
      } =
        await db.auth
          .getSession();


      if (
        !sessao ||
        !sessao.session
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>entre no admin para testar a busca privada ♡</div>";

        return;

      }


      resultado.innerHTML =
        "<div class='mensagem'>procurando...</div>";


      const {
        data:
          fotos,
        error
      } =
        await db
          .from(
            "fotos"
          )
          .select("*")
          .or(
            "tag1.eq." +
            termo +
            ",tag2.eq." +
            termo +
            ",tag3.eq." +
            termo
          )
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (error) {

        console.error(
          error
        );

        resultado.innerHTML =
          "<div class='mensagem'>erro na busca</div>";

        return;

      }


      if (
        !fotos ||
        fotos.length === 0
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>nenhuma lembrança encontrada ♡</div>";

        return;

      }


      resultado.innerHTML =
        "";


      for (
        const foto of fotos
      ) {

        const {
          data:
            assinatura,
          error:
            erroUrl
        } =
          await db.storage
            .from(BUCKET)
            .createSignedUrl(
              foto.arquivo,
              600
            );


        if (
          erroUrl ||
          !assinatura
        ) {

          continue;

        }


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "foto-card";


        const imagem =
          document.createElement(
            "img"
          );

        imagem.src =
          assinatura.signedUrl;

        imagem.alt =
          "lembrança";

        imagem.loading =
          "lazy";


        const tags =
          document.createElement(
            "div"
          );

        tags.className =
          "tags";


        [
          foto.tag1,
          foto.tag2,
          foto.tag3
        ].forEach(
          function(texto) {

            const tag =
              document.createElement(
                "span"
              );

            tag.className =
              "tag";

            tag.textContent =
              texto;

            tags.appendChild(
              tag
            );

          }
        );


        card.appendChild(
          imagem
        );

        card.appendChild(
          tags
        );

        resultado.appendChild(
          card
        );

      }

    }


    document
      .getElementById(
        "botaoBuscar"
      )
      .addEventListener(
        "click",
        buscar
      );


    document
      .getElementById(
        "busca"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            buscar();

          }

        }
      );


  </script>


</body>

</html>
