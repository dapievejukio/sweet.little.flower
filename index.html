<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>sweet.little.flower</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #fff9f5 0%,
          #f7e9e3 50%,
          #ead6d1 100%
        );

      color: #72565b;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .pagina {
      width: 88%;
      max-width: 430px;

      margin: auto;

      padding-top: 8vh;
      padding-bottom: 60px;

      text-align: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 3px;

      color: #bc7e89;
    }

    .coracao {
      margin-top: 12px;
      margin-bottom: 45px;

      color: #d49ca6;

      font-size: 1.2rem;
    }

    .pergunta {
      margin-bottom: 28px;

      font-size: .72rem;
      letter-spacing: 3px;

      color: #9f767d;
    }

    .play {
      width: 82px;
      height: 82px;

      border: none;
      border-radius: 50%;

      background: #ce8c98;
      color: white;

      font-size: 1.5rem;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(143, 87, 98, .22);
    }

    .play:active {
      transform: scale(.95);
    }

    .play:disabled {
      opacity: .45;
    }

    .ouvir {
      display: block;

      margin-top: 14px;
      margin-bottom: 32px;

      font-size: .65rem;
      letter-spacing: 2px;

      color: #ae898f;
    }

    .campo {
      width: 100%;

      padding: 17px 20px;

      margin-bottom: 12px;

      border: 1px solid #e2c9c6;
      border-radius: 40px;

      outline: none;

      background: #fffaf7;

      color: #71555a;

      text-align: center;

      font-size: 16px;
    }

    .campo:focus {
      border-color: #c98b96;
    }

    .campo::placeholder {
      color: #bea2a7;
    }

    .botao {
      width: 100%;

      padding: 16px;

      margin-top: 3px;

      border: none;
      border-radius: 40px;

      background: #c68591;
      color: white;

      font-size: .78rem;
      letter-spacing: 2px;

      cursor: pointer;
    }

    .botao:disabled {
      opacity: .55;
      cursor: default;
    }

    .botao-secundario {
      margin-top: 10px;

      background: #fffaf7;

      color: #a97c84;

      border: 1px solid #e3cac7;
    }

    .mensagem {
      min-height: 35px;

      padding-top: 15px;

      color: #ae737e;

      font-size: .75rem;
      line-height: 1.5;
    }

    .credito {
      margin-top: 15px;

      font-size: 10px;

      color: #b99b9f;
    }

    #areaPrincipal,
    #painelAdmin,
    #formUpload {
      display: none;
    }

    .subtitulo {
      margin-bottom: 25px;

      font-size: .72rem;
      letter-spacing: 2px;

      color: #a67c83;
    }

    .buscador {
      display: flex;

      padding: 6px;

      background: #fffaf7;

      border: 1px solid #e5ceca;
      border-radius: 40px;

      box-shadow:
        0 8px 25px
        rgba(110, 75, 82, .08);
    }

    #busca {
      min-width: 0;
      flex: 1;

      padding: 12px 15px;

      border: none;
      outline: none;

      background: transparent;

      color: #75585d;

      font-size: 16px;
    }

    .buscar {
      flex: 0 0 46px;

      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: #d3939e;
      color: white;

      cursor: pointer;
    }

    .linha-admin {
      margin-top: 20px;
    }

    .admin-link {
      padding: 10px;

      border: none;

      background: transparent;

      color: #b28b91;

      font-size: 11px;
      letter-spacing: 1px;

      cursor: pointer;
    }

    .caixa {
      margin-top: 28px;

      padding: 25px 18px;

      border-radius: 25px;

      background:
        rgba(255, 250, 247, .72);

      border:
        1px solid #e5cfcb;
    }

    .caixa h2 {
      margin-bottom: 22px;

      color: #9d777e;

      font-size: .75rem;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .upload-area {
      display: block;

      width: 100%;

      padding: 25px 15px;

      margin-bottom: 18px;

      border:
        1px dashed #d6afb5;

      border-radius: 22px;

      background: #fffaf7;

      color: #ae8189;

      cursor: pointer;
    }

    #arquivoFoto {
      display: none;
    }

    #preview {
      display: none;

      width: 100%;
      max-height: 340px;

      margin-bottom: 18px;

      object-fit: contain;

      border-radius: 20px;

      background: #f6e9e5;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 12px;
    }

    .tag {
      padding: 6px 11px;

      background: #f0dadd;

      border-radius: 20px;

      color: #916d74;

      font-size: 11px;
    }

    #resultado {
      margin-top: 30px;
    }

    .foto-card {
      margin-bottom: 30px;

      text-align: left;

      animation:
        aparecer .45s ease;
    }

    .foto-card img {
      display: block;

      width: 100%;

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(95, 65, 72, .13);
    }

    @keyframes aparecer {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .youtube-container {
      position: fixed;

      left: 0;
      bottom: 0;

      width: 200px;
      height: 200px;

      opacity: .001;

      overflow: hidden;

      pointer-events: none;

      z-index: -1;
    }

    #player {
      width: 200px;
      height: 200px;
    }

    .rodape {
      margin-top: 70px;

      color: #bea0a5;

      font-size: .6rem;
      letter-spacing: 2px;
    }


    /* =============================================
       TOAST
    ============================================= */

    #toastContainer {
      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 390px;

      z-index: 9999;

      pointer-events: none;
    }

    .toast {
      position: relative;

      padding:
        16px 42px
        16px 18px;

      border:
        1px solid #e5c9cc;

      border-radius: 20px;

      background:
        rgba(255, 250, 247, .98);

      color: #8d6870;

      font-size: 13px;
      line-height: 1.45;

      text-align: left;

      box-shadow:
        0 12px 35px
        rgba(102, 68, 75, .15);

      opacity: 0;

      transform:
        translateY(-25px);

      transition:
        opacity .35s ease,
        transform .35s ease;
    }

    .toast.visivel {
      opacity: 1;

      transform:
        translateY(0);
    }

    .toast.saindo {
      opacity: 0;

      transform:
        translateY(-18px);
    }

    .toast-coracao {
      margin-right: 7px;

      color: #cf929d;
    }

    .toast-fechar {
      position: absolute;

      top: 50%;
      right: 12px;

      width: 30px;
      height: 30px;

      transform:
        translateY(-50%);

      border: none;

      background: transparent;

      color: #c59aa1;

      font-size: 19px;

      cursor: pointer;

      pointer-events: auto;
    }


    @media (max-width: 480px) {

      .pagina {
        width: 90%;

        padding-top: 7vh;
      }

      .logo {
        font-size: 1.55rem;

        letter-spacing: 2.5px;
      }

    }

  </style>
</head>


<body>

          <input

          <button

          <button

    <div class="rodape">

  </main>



  <!-- PLAYER YOUTUBE -->

  <script>

    /* =================================================

      );

      );

      );

      );

    function normalizar(texto) {

      return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(

          ""
        );

    }

      },


      {

      },

        ]
      },

          "Nz7101ulkK0",

        ]
      }

    ];



    const indiceAtual =
      Math.floor(
        Math.random() *

    const musicaAtual =

    let player =
      null;


    let playerPronto =
      false;


    let tocando =
      false;



    /* =================================================
       YOUTUBE
    ================================================= */

    window.onYouTubeIframeAPIReady =
      function() {

        player =
          new YT.Player(
            "player",
            {

              width:
                "200",

              height:
                "200",

              videoId:
                musicaAtual.video,

              playerVars: {

                playsinline:
                  1,

                controls:
                  0,

                rel:
                  0,

                start:
                  musicaAtual.inicio

              },

              events: {

                onReady:
                  function() {

                    playerPronto =
                      true;


                    botaoPlay.disabled =
                      false;


                    statusMusica.textContent =
                      "toque para ouvir";

                  },


                onStateChange:
                  function(event) {

                    if (
                      event.data ===
                      YT.PlayerState.PLAYING
                    ) {

                      tocando =
                        true;


                      botaoPlay.textContent =
                        "❚❚";

                    }


                    else if (
                      event.data ===
                      YT.PlayerState.PAUSED ||
                      event.data ===
                      YT.PlayerState.ENDED
                    ) {

                      tocando =
                        false;


                      botaoPlay.textContent =
                        "▶";

                    }

                  },


                onError:
                  function() {

                    statusMusica.textContent =
                      "música indisponível";

                  }

              }

            }
          );

      };



    botaoPlay.addEventListener(
      "click",
      function() {

        if (
          !playerPronto ||
          !player
        ) {

          return;

        }


        if (tocando) {

          player.pauseVideo();

        }

        else {

          player.seekTo(
            musicaAtual.inicio,
            true
          );


          player.playVideo();

        }

      }
    );



    /* =================================================
       TOAST
    ================================================= */

    let mensagensIniciadas =
      false;


    let contadorBuscas =
      0;


    const mensagensUsadas =
      new Set();



    const mensagensExtras = [

      "essa busca foi muito específica 👀",

      "algumas fotos deveriam continuar esquecidas 😂",

      "mais uma?",

      "eu vi essa busca...",

      "você realmente não desiste ♡",

      "não vou perguntar o motivo dessa busca.",

      "tem coisa demais aqui dentro 🌸",

      "memórias desbloqueadas.",

      "isso está ficando suspeito 👀",

      "ok... essa eu deixo passar.",

      "você sabe que pode fechar o site, né?",

      "mais fotos. claro.",

      "sweet little stalker ♡"

    ];



    function fecharToast(toast) {

      if (
        !toast ||
        !toast.isConnected
      ) {

        return;

      }


      toast.classList.remove(
        "visivel"
      );


      toast.classList.add(
        "saindo"
      );


      window.setTimeout(
        function() {

          if (
            toast.isConnected
          ) {

            toast.remove();

          }

        },
        350
      );

    }



    function mostrarToast(texto) {

      const container =
        document.getElementById(
          "toastContainer"
        );


      if (!container) {

        return;

      }


      const anterior =
        container.querySelector(
          ".toast"
        );


      if (anterior) {

        anterior.remove();

      }


      const toast =
        document.createElement(
          "div"
        );


      toast.className =
        "toast";


      const coracao =
        document.createElement(
          "span"
        );


      coracao.className =
        "toast-coracao";


      coracao.textContent =
        "♡";


      const textoToast =
        document.createElement(
          "span"
        );


      textoToast.textContent =
        texto;


      const fechar =
        document.createElement(
          "button"
        );


      fechar.type =
        "button";


      fechar.className =
        "toast-fechar";


      fechar.setAttribute(
        "aria-label",
        "Fechar mensagem"
      );


      fechar.textContent =
        "×";


      toast.appendChild(
        coracao
      );


      toast.appendChild(
        textoToast
      );


      toast.appendChild(
        fechar
      );


      container.appendChild(
        toast
      );


      fechar.addEventListener(
        "click",
        function() {

          fecharToast(
            toast
          );

        }
      );


      requestAnimationFrame(
        function() {

          requestAnimationFrame(
            function() {

              toast.classList.add(
                "visivel"
              );

            }
          );

        }
      );


      window.setTimeout(
        function() {

          fecharToast(
            toast
          );

        },
        5000
      );

    }



    function iniciarMensagens() {

      if (mensagensIniciadas) {

        return;

      }


      mensagensIniciadas =
        true;


      /*

          );

      );

      */

          );

        },

      );


      /*
        6 minutos
      */

      window.setTimeout(

          mostrarToast(

          );

        },

      );


      /*
        10 minutos
      */

      window.setTimeout(
        function() {

          mostrarToast(
            "sério que você ainda está aqui?"
          );

        },
        600000
      );

    }



    function mensagemAleatoria() {

      let disponiveis =
        mensagensExtras.filter(
          function(frase) {

            return !mensagensUsadas.has(
              frase
            );

          }
        );


      if (
        disponiveis.length === 0
      ) {

        mensagensUsadas.clear();


        disponiveis =
          [...mensagensExtras];

      }


      const indice =
        Math.floor(
          Math.random() *
          disponiveis.length
        );


      const frase =
        disponiveis[indice];


      mensagensUsadas.add(
        frase
      );


      return frase;

    }



    function registrarBusca() {

      contadorBuscas++;


      if (
        contadorBuscas === 3
      ) {

        mostrarToast(
          "já é a terceira busca 👀"
        );

      }


      else if (
        contadorBuscas === 5
      ) {

        mostrarToast(
          "curiosa demais hoje, não?"
        );

      }


      else if (
        contadorBuscas === 8
      ) {

        mostrarToast(
          "o mundo lá fora ainda existe 🌸"
        );

      }


      else if (
        contadorBuscas >= 10 &&
        contadorBuscas % 4 === 0
      ) {

        mostrarToast(
          mensagemAleatoria()
        );

      }

    }



    /* =================================================
       QUIZ
    ================================================= */

    function validarQuiz() {

      const valor =
        normalizar(
          resposta.value
        );


      const respostasCorretas =
        musicaAtual.respostas.map(
          normalizar
        );


      if (
        respostasCorretas.includes(
          valor
        )
      ) {

        if (
          player &&
          typeof player.pauseVideo ===
            "function"
        ) {

          player.pauseVideo();

        }


        entrada.style.display =
          "none";


        areaPrincipal.style.display =
          "block";


        mensagemQuiz.textContent =
          "";


        iniciarMensagens();


        verificarSessao();

      }

      else {

        mensagemQuiz.textContent =
          "tente outra vez ♫";

      }

    }



    document
      .getElementById(
        "entrar"
      )
      .addEventListener(
        "click",
        validarQuiz
      );



    resposta.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          validarQuiz();

        }

      }
    );



    /* =================================================
       ADMIN
    ================================================= */

    document
      .getElementById(
        "abrirAdmin"
      )
      .addEventListener(
        "click",
        function() {

          const aberto =
            painelAdmin.style.display ===
            "block";


          painelAdmin.style.display =
            aberto
              ? "none"
              : "block";

        }
      );



    /* =================================================
       LOGIN
    ================================================= */

    async function login() {

      const email =
        document
          .getElementById(
            "adminEmail"
          )
          .value
          .trim();


      const senha =
        document
          .getElementById(
            "adminSenha"
          )
          .value;


      if (
        !email ||
        !senha
      ) {

        mensagemAdmin.textContent =
          "preencha e-mail e senha";

        return;

      }


      mensagemAdmin.textContent =
        "entrando...";


      const {
        error
      } =
        await db.auth
          .signInWithPassword(
            {

              email:
                email,

              password:
                senha

            }
          );


      if (error) {

        console.error(
          error
        );


        mensagemAdmin.textContent =
          "não foi possível entrar";

        return;

      }


      mensagemAdmin.textContent =
        "admin conectado ♡";


      mostrarUpload();

    }



    document
      .getElementById(
        "botaoLogin"
      )
      .addEventListener(
        "click",
        login
      );



    document
      .getElementById(
        "adminSenha"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            login();

          }

        }
      );



    /* =================================================
       SESSÃO
    ================================================= */

    async function verificarSessao() {

      const {
        data,
        error
      } =
        await db.auth
          .getSession();


      if (error) {

        console.error(
          error
        );

        return;

      }


      if (
        data &&
        data.session
      ) {

        mostrarUpload();

      }

    }



    function mostrarUpload() {

      loginAdmin.style.display =
        "none";


      formUpload.style.display =
        "block";

    }



    /* =================================================
       LOGOUT
    ================================================= */

    document
      .getElementById(
        "logout"
      )
      .addEventListener(
        "click",
        async function() {

          await db.auth
            .signOut();


          formUpload.style.display =
            "none";


          loginAdmin.style.display =
            "block";


          mensagemAdmin.textContent =
            "admin desconectado";


          resultado.innerHTML =
            "";

        }
      );



    /* =================================================
       PREVIEW
    ================================================= */

    inputArquivo.addEventListener(
      "change",
      function(event) {

        const arquivo =
          event.target.files &&
          event.target.files[0];


        if (!arquivo) {

          preview.style.display =
            "none";

          return;

        }


        if (
          !arquivo.type.startsWith(
            "image/"
          )
        ) {

          mensagemAdmin.textContent =
            "escolha um arquivo de imagem";


          inputArquivo.value =
            "";


          preview.style.display =
            "none";

          return;

        }


        const url =
          URL.createObjectURL(
            arquivo
          );


        preview.src =
          url;


        preview.style.display =
          "block";


        preview.onload =
          function() {

            URL.revokeObjectURL(
              url
            );

          };


        mensagemAdmin.textContent =
          "";

      }
    );



    /* =================================================
       UPLOAD
    ================================================= */

    async function salvarFoto() {

      const arquivo =
        inputArquivo.files &&
        inputArquivo.files[0];


      const tag1 =
        normalizar(
          document
            .getElementById(
              "tag1"
            )
            .value
        );


      const tag2 =
        normalizar(
          document
            .getElementById(
              "tag2"
            )
            .value
        );


      const tag3 =
        normalizar(
          document
            .getElementById(
              "tag3"
            )
            .value
        );


      if (!arquivo) {

        mensagemAdmin.textContent =
          "escolha uma foto";

        return;

      }


      if (
        !tag1 ||
        !tag2 ||
        !tag3
      ) {

        mensagemAdmin.textContent =
          "preencha as 3 tags";

        return;

      }


      const {
        data:
          sessao
      } =
        await db.auth
          .getSession();


      if (
        !sessao ||
        !sessao.session
      ) {

        mensagemAdmin.textContent =
          "faça login novamente";

        return;

      }


      const botao =
        document.getElementById(
          "salvarFoto"
        );


      botao.disabled =
        true;


      botao.textContent =
        "enviando...";


      mensagemAdmin.textContent =
        "enviando foto...";


      try {


        let extensao =
          arquivo.name
            .split(".")
            .pop()
            .toLowerCase();


        extensao =
          extensao.replace(
            /[^a-z0-9]/g,
            ""
          );


        if (!extensao) {

          extensao =
            "jpg";

        }


        const aleatorio =
          Math.random()
            .toString(36)
            .slice(2, 10);


        const nomeArquivo =
          Date.now() +
          "-" +
          aleatorio +
          "." +
          extensao;



        /*
          ENVIA FOTO PARA STORAGE
        */

        const {
          error:
            erroUpload
        } =
          await db.storage
            .from(BUCKET)
            .upload(
              nomeArquivo,
              arquivo,
              {

                cacheControl:
                  "3600",

                upsert:
                  false,

                contentType:
                  arquivo.type

              }
            );


        if (erroUpload) {

          console.error(
            erroUpload
          );


          throw new Error(
            "UPLOAD"
          );

        }



        /*
          GRAVA NA TABELA
        */

        const {
          error:
            erroBanco
        } =
          await db
            .from("fotos")
            .insert(
              {

                arquivo:
                  nomeArquivo,

                tag1:
                  tag1,

                tag2:
                  tag2,

                tag3:
                  tag3

              }
            );


        if (erroBanco) {

          console.error(
            erroBanco
          );


          throw new Error(
            "BANCO"
          );

        }



        mensagemAdmin.textContent =
          "foto salva ♡";


        mostrarToast(
          "nova lembrança guardada ♡"
        );


        inputArquivo.value =
          "";


        document
          .getElementById(
            "tag1"
          )
          .value =
          "";


        document
          .getElementById(
            "tag2"
          )
          .value =
          "";


        document
          .getElementById(
            "tag3"
          )
          .value =
          "";


        preview.removeAttribute(
          "src"
        );


        preview.style.display =
          "none";

      }

      catch (erro) {

        console.error(
          erro
        );


        if (
          erro.message ===
          "BANCO"
        ) {

          mensagemAdmin.textContent =
            "foto enviada, mas houve erro ao salvar as tags";

        }

        else {

          mensagemAdmin.textContent =
            "erro ao enviar a foto";

        }

      }

      finally {

        botao.disabled =
          false;


        botao.textContent =
          "salvar foto ♡";

      }

    }



    document
      .getElementById(
        "salvarFoto"
      )
      .addEventListener(
        "click",
        salvarFoto
      );



    /* =================================================
       BUSCA
    ================================================= */

    async function buscar() {

      const termo =
        normalizar(
          document
            .getElementById(
              "busca"
            )
            .value
        );


      resultado.innerHTML =
        "";


      if (!termo) {

        return;

      }


      registrarBusca();


      const {
        data:
          sessao
      } =
        await db.auth
          .getSession();


      if (
        !sessao ||
        !sessao.session
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>entre no admin para testar a busca privada ♡</div>";


        return;

      }


      resultado.innerHTML =
        "<div class='mensagem'>procurando...</div>";



      const {
        data:
          fotos,
        error
      } =
        await db
          .from("fotos")
          .select("*")
          .or(
            "tag1.eq." +
            termo +
            ",tag2.eq." +
            termo +
            ",tag3.eq." +
            termo
          )
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (error) {

        console.error(
          error
        );


        resultado.innerHTML =
          "<div class='mensagem'>erro na busca</div>";


        return;

      }


      if (
        !fotos ||
        fotos.length === 0
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>nenhuma lembrança encontrada ♡</div>";


        return;

      }


      resultado.innerHTML =
        "";


      for (
        const foto of fotos
      ) {


        const {
          data:
            assinatura,
          error:
            erroUrl
        } =
          await db.storage
            .from(BUCKET)
            .createSignedUrl(
              foto.arquivo,
              600
            );


        if (
          erroUrl ||
          !assinatura ||
          !assinatura.signedUrl
        ) {

          console.error(
            erroUrl
          );


          continue;

        }


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "foto-card";


        const imagem =
          document.createElement(
            "img"
          );


        imagem.src =
          assinatura.signedUrl;


        imagem.alt =
          "lembrança";


        imagem.loading =
          "lazy";


        const tags =
          document.createElement(
            "div"
          );


        tags.className =
          "tags";


        [
          foto.tag1,
          foto.tag2,
          foto.tag3
        ].forEach(
          function(tagTexto) {

            const tag =
              document.createElement(
                "span"
              );


            tag.className =
              "tag";


            tag.textContent =
              tagTexto;


            tags.appendChild(
              tag
            );

          }
        );


        card.appendChild(
          imagem
        );


        card.appendChild(
          tags
        );


        resultado.appendChild(
          card
        );

      }


      if (
        resultado.children.length === 0
      ) {

        resultado.innerHTML =
          "<div class='mensagem'>não foi possível abrir a foto ♡</div>";

      }

    }



    document
      .getElementById(
        "botaoBuscar"
      )
      .addEventListener(
        "click",
        buscar
      );



    document
      .getElementById(
        "busca"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            buscar();

          }

        }
      );


  </script>
