/*

/* =====================================
   MÚSICAS DA PORTA DE ENTRADA
===================================== */

const entradaMusical =
biblioteca.filter(
  m =>
  [
    'Måneskin',
    'Damiano David',
    'Nirvana',
    'ILLIT',
    'BLACKPINK',
    'JENNIE',
    'Red Velvet',
    'aespa',
    'NewJeans',
    'LE SSERAFIM',
    "Guns N' Roses"
  ]
  .includes(m.artista)
);


let usados =
new Set();


musicaAtual =
rnd(entradaMusical);


/* =====================================
   TOAST
===================================== */

function toast(t){

const c =
document.getElementById('toast');

c.innerHTML = '';

const d =
document.createElement('div');

d.className =
'toast';

d.textContent =
'♡  ' + t;

c.appendChild(d);

setTimeout(
  () => {
    if(d.isConnected){
      d.remove();
    }
  },
  4500
);

}


/* =====================================
   YOUTUBE
===================================== */

window.onYouTubeIframeAPIReady =
() => {

player =
new YT.Player(
'player',
{

videoId:
musicaAtual.video,

playerVars:{
  playsinline:1,
  controls:0,
  rel:0
},

events:{

onReady:()=>{

  playerPronto=true;

  document
  .getElementById('play')
  .disabled=false;

  document
  .getElementById('status')
  .textContent=
  'toque para ouvir';

},

onStateChange:e=>{

  tocando =
  e.data ===
  YT.PlayerState.PLAYING;

  document
  .getElementById('play')
  .textContent =
  tocando
  ? '❚❚'
  : '▶';

}

}

});

};


document
.getElementById('play')
.onclick =
()=>{

if(!playerPronto){
  return;
}

if(tocando){

  player.pauseVideo();

}else{

  player.seekTo(
    musicaAtual.inicio,
    true
  );

  player.playVideo();

}

};


/* =====================================
   RESPOSTA
===================================== */

function correta(m,v){

return m
.respostas
.map(norm)
.includes(
  norm(v)
);

}


function validar(){

const respostaUsuario =
document
.getElementById('resposta')
.value;


if(
  correta(
    musicaAtual,
    respostaUsuario
  )
){

  player.pauseVideo();

  document
  .getElementById('entrada')
  .style.display =
  'none';

  document
  .getElementById('areaPrincipal')
  .style.display =
  'block';

  verificarSessao();

  setTimeout(
    ()=>toast(
      'bem-vinda ♡'
    ),
    900
  );

}else{

  document
  .getElementById('mensagemQuiz')
  .textContent =
  'tente outra vez ♫';

}

}


document
.getElementById('entrar')
.onclick =
validar;


document
.getElementById('resposta')
.onkeydown =
e=>{

if(e.key==='Enter'){
  validar();
}

};


/* =====================================
   NÃO REPETIR MÚSICA NOS JOGOS
===================================== */

function proximaMusica(){

let disponiveis =
biblioteca.filter(
  m =>
  !usados.has(m.video)
);


if(!disponiveis.length){

  usados.clear();

  disponiveis =
  [...biblioteca];

}


const m =
rnd(disponiveis);


usados.add(
  m.video
);


return m;

}


/* =====================================
   DESAFIO MUSICAL
===================================== */

function abrirDesafio(){

const m =
proximaMusica();


musicaAtual =
m;


player.cueVideoById({
  videoId:m.video,
  startSeconds:m.inicio
});


document
.getElementById('modalBg')
.classList
.add('on');


const conteudo =
document
.getElementById('modalConteudo');


conteudo.innerHTML =
'';


const p =
document.createElement(
  'button'
);

p.className =
'play';

p.textContent =
'▶';

p.style.width =
'68px';

p.style.height =
'68px';


const i =
document.createElement(
  'input'
);

i.className =
'campo';

i.placeholder =
'quem está tocando?';

i.style.marginTop =
'18px';


const b =
document.createElement(
  'button'
);

b.className =
'botao';

b.textContent =
'responder';


let timerMusica =
null;


p.onclick =
()=>{

if(timerMusica){
  clearTimeout(timerMusica);
}

player.seekTo(
  m.inicio,
  true
);

player.playVideo();


timerMusica =
setTimeout(
  ()=>{

    try{
      player.pauseVideo();
    }catch(e){}

  },
  10000
);

};


b.onclick =
()=>{

if(timerMusica){
  clearTimeout(timerMusica);
}

player.pauseVideo();


if(
  correta(
    m,
    i.value
  )
){

  toast(
    'acertou ♡'
  );

}else{

  toast(
    'era ' +
    m.artista +
    ' 👀'
  );

}


document
.getElementById('modalBg')
.classList
.remove('on');

};


conteudo.append(
  p,
  i,
  b
);

}

const arquivo =
document
.getElementById('arquivoFoto')
.files?.[0];


if(!arquivo){
  return;
}


const url =
URL.createObjectURL(
  arquivo
);


const preview =
document
.getElementById('preview');


preview.src =
url;

preview.style.display =
'block';


preview.onload =
()=>URL.revokeObjectURL(url);

};


/* =====================================
   UPLOAD
===================================== */

document
.getElementById('salvarFoto')
.onclick =
async()=>{

const arquivo =
document
.getElementById('arquivoFoto')
.files?.[0];


const a =
norm(
  document
  .getElementById('tag1')
  .value
);

const b =
norm(
  document
  .getElementById('tag2')
  .value
);

const c =
norm(
  document
  .getElementById('tag3')
  .value
);


if(!adminLogado){

  document
  .getElementById('mensagemAdmin')
  .textContent =
  'entre como admin';

  return;

}


if(
  !arquivo ||
  !a ||
  !b ||
  !c
){

  document
  .getElementById('mensagemAdmin')
  .textContent =
  'escolha a foto e preencha as 3 tags';

  return;

}


const botaoSalvar =
document
.getElementById('salvarFoto');


botaoSalvar.disabled =
true;


const ext =
arquivo.name
.split('.')
.pop()
.toLowerCase();


const nome =
Date.now() +
'-' +
Math.random()
.toString(36)
.slice(2,10) +
'.' +
ext;


const upload =
await db.storage
.from(BUCKET)
.upload(
  nome,
  arquivo
);


if(upload.error){

  document
  .getElementById('mensagemAdmin')
  .textContent =
  'erro ao enviar a foto';

  botaoSalvar.disabled =
  false;

  return;

}


const insert =
await db
.from('fotos')
.insert({
  arquivo:nome,
  tag1:a,
  tag2:b,
  tag3:c
});


if(insert.error){

  await db.storage
  .from(BUCKET)
  .remove([nome]);

  document
  .getElementById('mensagemAdmin')
  .textContent =
  'erro ao salvar as tags';

  botaoSalvar.disabled =
  false;

  return;

}


document
.getElementById('arquivoFoto')
.value =
'';


document
.getElementById('tag1')
.value =
'';

document
.getElementById('tag2')
.value =
'';

document
.getElementById('tag3')
.value =
'';


document
.getElementById('preview')
.style.display =
'none';


document
.getElementById('mensagemAdmin')
.textContent =
'foto salva ♡';


botaoSalvar.disabled =
false;


toast(
  'nova lembrança guardada ♡'
);

};


/* =====================================
   EXCLUIR
===================================== */

async function excluirFoto(
  foto,
  card,
  btn
){

if(!adminLogado){
  return;
}


if(
  !confirm(
    'Apagar esta foto definitivamente?'
  )
){
  return;
}


btn.disabled =
true;

btn.textContent =
'excluindo...';


const storage =
await db.storage
.from(BUCKET)
.remove([
  foto.arquivo
]);


if(storage.error){

  toast(
    'erro ao apagar a imagem'
  );

  btn.disabled =
  false;

  btn.textContent =
  '🗑 excluir';

  return;

}


const tabela =
await db
.from('fotos')
.delete()
.eq(
  'id',
  foto.id
);


if(tabela.error){

  toast(
    'imagem apagada, mas houve erro no registro'
  );

  return;

}


card.remove();


toast(
  'foto apagada definitivamente'
);

}


/* =====================================
   BUSCAR FOTOS
   VISITANTE NÃO PRECISA DE LOGIN
===================================== */

async function buscar(){

const termo =
norm(
  document
  .getElementById('busca')
  .value
);


if(!termo){
  return;
}


const resultado =
document
.getElementById('resultado');


resultado.innerHTML =
'<div class="mensagem">procurando...</div>';


/*
Verifica se há sessão apenas para saber
se devemos mostrar o botão excluir.

A BUSCA NÃO DEPENDE DO LOGIN.
*/

await verificarSessao();


const consulta =
await db
.from('fotos')
.select('*')
.or(
  `tag1.eq.${termo},tag2.eq.${termo},tag3.eq.${termo}`
)
.order(
  'created_at',
  {
    ascending:false
  }
);


if(consulta.error){

  console.error(
    consulta.error
  );

  resultado.innerHTML =
  '<div class="mensagem">erro na busca</div>';

  return;

}


if(
  !consulta.data ||
  !consulta.data.length
){

  resultado.innerHTML =
  '<div class="mensagem">nenhuma lembrança encontrada ♡</div>';

  return;

}


resultado.innerHTML =
'';


for(
  const foto of consulta.data
){

/*
O bucket continua privado.

A policy SELECT anon permite que
o visitante solicite uma URL temporária.
*/

const assinatura =
await db.storage
.from(BUCKET)
.createSignedUrl(
  foto.arquivo,
  600
);


if(
  assinatura.error ||
  !assinatura.data?.signedUrl
){
  continue;
}


const card =
document.createElement(
  'article'
);

card.className =
'foto-card';


const img =
document.createElement(
  'img'
);

img.src =
assinatura.data.signedUrl;

img.loading =
'lazy';

img.alt =
'lembrança';


const tags =
document.createElement(
  'div'
);

tags.className =
'tags';


[
  foto.tag1,
  foto.tag2,
  foto.tag3
]
.filter(Boolean)
.forEach(
  texto=>{

    const span =
    document.createElement(
      'span'
    );

    span.className =
    'tag';

    span.textContent =
    texto;

    tags.appendChild(
      span
    );

  }
);


card.append(
  img,
  tags
);


/*
EXCLUIR SÓ APARECE
QUANDO ADMIN ESTÁ LOGADO
*/

if(adminLogado){

  const area =
  document.createElement(
    'div'
  );

  area.className =
  'area-excluir';


  const botao =
  document.createElement(
    'button'
  );

  botao.className =
  'excluir';

  botao.textContent =
  '🗑 excluir';


  botao.onclick =
  ()=>excluirFoto(
    foto,
    card,
    botao
  );


  area.appendChild(
    botao
  );

  card.appendChild(
    area
  );

}


resultado.appendChild(
  card
);

}

}


document
.getElementById('botaoBuscar')
.onclick =
buscar;


document
.getElementById('busca')
.onkeydown =
e=>{

if(e.key==='Enter'){
  buscar();
}

};

</script>

</body>
</html>
