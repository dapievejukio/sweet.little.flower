<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>sweet.little.flower</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background:
        radial-gradient(circle at top, #fff9f5 0%, #f7e9e3 48%, #ead6d1 100%);

      color: #72565b;
    }

    .pagina {
      width: 88%;
      max-width: 430px;
      margin: auto;
      padding-top: 13vh;
      text-align: center;
    }

    /* LOGO */

    .logo {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #bc7e89;
    }

    .coracao {
      margin-top: 12px;
      margin-bottom: 50px;
      color: #d49ca6;
      font-size: 1.1rem;
    }

    /* ENTRADA */

    #entrada {
      display: block;
    }

    .pergunta {
      margin-bottom: 27px;
      font-size: 0.72rem;
      letter-spacing: 3px;
      color: #9f767d;
    }

    /* BOTÃO PLAY */

    .play {
      width: 82px;
      height: 82px;

      border: 0;
      border-radius: 50%;

      background: #ce8c98;
      color: white;

      font-size: 1.45rem;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(143, 87, 98, 0.22);

      transition: 0.2s;
    }

    .play:active {
      transform: scale(0.94);
    }

    .ouvir {
      display: block;

      margin-top: 13px;
      margin-bottom: 32px;

      color: #ae898f;

      font-size: 0.64rem;
      letter-spacing: 2px;
    }

    /* CAMPO */

    .campo {
      width: 100%;

      padding: 17px 20px;

      border: 1px solid #e2c9c6;
      border-radius: 40px;

      outline: none;

      background: rgba(255, 250, 247, 0.95);

      color: #71555a;

      text-align: center;

      font-size: 16px;

      box-shadow:
        0 6px 20px
        rgba(115, 78, 85, 0.07);
    }

    .campo::placeholder {
      color: #bea2a7;
    }

    .entrar {
      width: 100%;

      margin-top: 14px;
      padding: 16px;

      border: 0;
      border-radius: 40px;

      background: #c68591;
      color: white;

      font-size: 0.78rem;
      letter-spacing: 2px;

      cursor: pointer;
    }

    .mensagem {
      min-height: 32px;

      padding-top: 15px;

      color: #ae737e;

      font-size: 0.75rem;
    }

    /* CRÉDITO */

    .credito {
      margin-top: 18px;

      font-size: 10px;

      color: #b99b9f;
    }

    .credito a {
      color: #a97e85;
      text-decoration: none;
    }

    /* WIDGET REAL */

    .soundcloud {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;

      opacity: 0.01;

      left: -9999px;
    }

    /* CONTEÚDO */

    #conteudo {
      display: none;

      animation: aparecer 0.6s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .liberado {
      margin-bottom: 30px;

      font-size: 0.7rem;
      letter-spacing: 2px;

      color: #a67c83;
    }

    /* BUSCADOR */

    .buscador {
      display: flex;

      padding: 6px;

      background: #fffaf7;

      border: 1px solid #e5ceca;
      border-radius: 40px;

      box-shadow:
        0 8px 25px
        rgba(110, 75, 82, 0.08);
    }

    #busca {
      min-width: 0;
      flex: 1;

      padding: 12px 15px;

      border: none;
      outline: none;

      background: transparent;

      color: #75585d;

      font-size: 16px;
    }

    #busca::placeholder {
      color: #bea3a7;
    }

    .buscar {
      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: #d3939e;
      color: white;

      cursor: pointer;
    }

    #resultado {
      margin-top: 35px;
    }

    .rodape {
      margin-top: 80px;

      color: #bea0a5;

      font-size: 0.6rem;
      letter-spacing: 2px;
    }

    @media (max-width: 500px) {

      .pagina {
        padding-top: 11vh;
      }

      .logo {
        font-size: 1.55rem;
      }

    }
  </style>
</head>


<body>

  <main class="pagina">

    <div class="logo">
      sweet.little.flower
    </div>

    <div class="coracao">
      ♡
    </div>


    <!-- ENTRADA MUSICAL -->

    <section id="entrada">

      <div class="pergunta">
        quem está tocando?
      </div>


      <button
        id="play"
        class="play"
        aria-label="Tocar música"
      >
        ▶
      </button>


      <span class="ouvir">
        toque para ouvir
      </span>


      <input
        id="resposta"
        class="campo"
        type="text"
        placeholder="quem é?"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
      >


      <button
        id="botaoEntrar"
        class="entrar"
      >
        entrar
      </button>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <div class="credito">
        áudio via
        <a
          href="https://soundcloud.com/maneskin"
          target="_blank"
          rel="noopener noreferrer"
        >
          SoundCloud
        </a>
      </div>

    </section>


    <!-- ÁREA LIBERADA -->

    <section id="conteudo">

      <div class="liberado">
        ♡ encontre sua lembrança
      </div>


      <div class="buscador">

        <input
          id="busca"
          type="text"
          placeholder="buscar..."
          autocomplete="off"
          autocapitalize="none"
        >


        <button
          id="botaoBuscar"
          class="buscar"
        >
          ♡
        </button>

      </div>


      <div id="resultado"></div>

    </section>


    <div class="rodape">
      sweet.little.flower
    </div>

  </main>


  <!--
      SOUNDCLOUD

      Música:
      Beggin' — Måneskin
  -->

  <div class="soundcloud">

    <iframe
      id="sc-player"
      width="100%"
      height="166"
      scrolling="no"
      frameborder="no"
      allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/maneskin/beggin&auto_play=false&show_artwork=false&show_user=false&show_comments=false&sharing=false&download=false"
    >
    </iframe>

  </div>


  <!-- API OFICIAL SOUNDCLOUD -->

  <script src="https://w.soundcloud.com/player/api.js"></script>


  <script>

    /*
      ================================
      SOUNDCLOUD
      ================================
    */

    const iframe =
      document.getElementById("sc-player");

    const widget =
      SC.Widget(iframe);

    const play =
      document.getElementById("play");

    const mensagem =
      document.getElementById("mensagem");

    let tocando = false;
    let pronto = false;


    widget.bind(
      SC.Widget.Events.READY,
      function () {

        pronto = true;

      }
    );


    widget.bind(
      SC.Widget.Events.PLAY,
      function () {

        tocando = true;

        play.textContent = "❚❚";

      }
    );


    widget.bind(
      SC.Widget.Events.PAUSE,
      function () {

        tocando = false;

        play.textContent = "▶";

      }
    );


    widget.bind(
      SC.Widget.Events.FINISH,
      function () {

        tocando = false;

        play.textContent = "▶";

      }
    );


    /*
      ================================
      BOTÃO PLAY
      ================================
    */

    play.addEventListener(
      "click",
      function () {

        mensagem.textContent = "";


        if (!pronto) {

          mensagem.textContent =
            "carregando música... ♫";

          return;

        }


        if (tocando) {

          widget.pause();

        } else {

          widget.play();

        }

      }
    );


    /*
      ================================
      NORMALIZAR TEXTO
      ================================
    */

    function normalizar(texto) {

      return texto
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }


    /*
      ================================
      RESPOSTAS
      ================================
    */

    const respostasValidas = [
      "maneskin",
      "måneskin"
    ];


    /*
      ================================
      VALIDAR ENTRADA
      ================================
    */

    const resposta =
      document.getElementById("resposta");

    const entrada =
      document.getElementById("entrada");

    const conteudo =
      document.getElementById("conteudo");


    function validarResposta() {

      const tentativa =
        normalizar(resposta.value);


      const corretas =
        respostasValidas.map(normalizar);


      if (
        corretas.includes(tentativa)
      ) {

        widget.pause();

        widget.seekTo(0);

        entrada.style.display =
          "none";

        conteudo.style.display =
          "block";

        return;

      }


      mensagem.textContent =
        "tente outra vez ♫";


      resposta.value = "";

      resposta.focus();

    }


    document
      .getElementById("botaoEntrar")
      .addEventListener(
        "click",
        validarResposta
      );


    resposta.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          validarResposta();

        }

      }
    );


    /*
      ================================
      FOTOS
      ================================

      Depois cadastraremos aqui:

      comando
      arquivo
      legenda
    */


    const fotos = [];


    /*
      ================================
      BUSCAR FOTO
      ================================
    */

    function buscarFoto() {

      const campo =
        document.getElementById("busca");

      const resultado =
        document.getElementById("resultado");

      const comando =
        normalizar(campo.value);


      resultado.innerHTML = "";


      if (!comando) {

        return;

      }


      const foto =
        fotos.find(
          item =>
            normalizar(item.comando)
            === comando
        );


      if (!foto) {

        resultado.innerHTML = `
          <div
            style="
              font-size:18px;
              color:#c69ca3;
            "
          >
            ♡
          </div>
        `;

        return;

      }


      resultado.innerHTML = `

        <div>

          <img
            src="${foto.arquivo}"
            alt=""
            style="
              width:100%;
              border-radius:20px;
              box-shadow:
                0 10px 30px
                rgba(100,70,75,.12);
            "
          >

          <div
            style="
              margin-top:14px;
              font-size:13px;
              color:#96747a;
            "
          >

            ${foto.legenda}

          </div>

        </div>

      `;

    }


    document
      .getElementById("botaoBuscar")
      .addEventListener(
        "click",
        buscarFoto
      );


    document
      .getElementById("busca")
      .addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            buscarFoto();

          }

        }
      );

  </script>

</body>

</html>
