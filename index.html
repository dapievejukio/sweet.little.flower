<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>sweet.little.flower</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  background:
    radial-gradient(
      circle at top,
      #fff9f5 0%,
      #f7e9e3 50%,
      #ead6d1 100%
    );

  color: #72565b;
}

.pagina {
  width: 88%;
  max-width: 430px;
  margin: auto;
  padding-top: 11vh;
  text-align: center;
}

.logo {
  font-size: 1.8rem;
  font-weight: 300;
  letter-spacing: 3px;
  color: #bc7e89;
}

.coracao {
  margin-top: 12px;
  margin-bottom: 50px;
  color: #d49ca6;
  font-size: 1.2rem;
}

.pergunta {
  margin-bottom: 28px;
  font-size: .72rem;
  letter-spacing: 3px;
  color: #9f767d;
}

.play {
  width: 82px;
  height: 82px;

  border: none;
  border-radius: 50%;

  background: #ce8c98;
  color: white;

  font-size: 1.5rem;

  cursor: pointer;

  box-shadow:
    0 10px 30px rgba(143,87,98,.22);
}

.play:disabled {
  opacity: .55;
}

.ouvir {
  display: block;

  margin-top: 14px;
  margin-bottom: 32px;

  font-size: .65rem;
  letter-spacing: 2px;

  color: #ae898f;
}

.campo {
  width: 100%;

  padding: 17px 20px;

  border: 1px solid #e2c9c6;
  border-radius: 40px;

  outline: none;

  background: #fffaf7;

  color: #71555a;

  text-align: center;

  font-size: 16px;
}

.campo::placeholder {
  color: #bea2a7;
}

.entrar {
  width: 100%;

  margin-top: 14px;
  padding: 16px;

  border: none;
  border-radius: 40px;

  background: #c68591;
  color: white;

  font-size: .78rem;
  letter-spacing: 2px;

  cursor: pointer;
}

.mensagem {
  min-height: 35px;

  padding-top: 16px;

  color: #ae737e;

  font-size: .75rem;
}

#conteudo {
  display: none;
}

.liberado {
  margin-bottom: 30px;

  font-size: .7rem;
  letter-spacing: 2px;

  color: #a67c83;
}

.buscador {
  display: flex;

  padding: 6px;

  background: #fffaf7;

  border: 1px solid #e5ceca;
  border-radius: 40px;
}

#busca {
  min-width: 0;
  flex: 1;

  padding: 12px 15px;

  border: none;
  outline: none;

  background: transparent;

  color: #75585d;

  font-size: 16px;
}

.buscar {
  width: 46px;
  height: 46px;

  border: none;
  border-radius: 50%;

  background: #d3939e;
  color: white;

  cursor: pointer;
}

.credito {
  margin-top: 20px;

  font-size: 10px;

  color: #b99b9f;
}

.credito a {
  color: #a97e85;
  text-decoration: none;
}

.rodape {
  margin-top: 80px;

  color: #bea0a5;

  font-size: .6rem;
  letter-spacing: 2px;
}


/*
IMPORTANTE:

O player NÃO fica display:none.

Ele permanece incorporado na página,
mas praticamente invisível visualmente.
*/

.youtube-container {
  width: 200px;
  height: 200px;

  position: fixed;

  left: 0;
  bottom: 0;

  opacity: 0.001;

  overflow: hidden;

  pointer-events: none;

  z-index: -1;
}

#player {
  width: 200px;
  height: 200px;
}

</style>
</head>


<body>

<main class="pagina">

  <div class="logo">
    sweet.little.flower
  </div>

  <div class="coracao">
    ♡
  </div>


  <!-- ENTRADA -->

  <section id="entrada">

    <div class="pergunta">
      quem está tocando?
    </div>


    <button
      id="play"
      class="play"
      disabled
    >
      ▶
    </button>


    <span
      id="status"
      class="ouvir"
    >
      preparando música...
    </span>


    <input
      id="resposta"
      class="campo"
      type="text"
      placeholder="sua resposta..."
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >


    <button
      id="entrar"
      class="entrar"
    >
      entrar
    </button>


    <div
      id="mensagem"
      class="mensagem"
    ></div>


    <div class="credito">

      música via

      <a
        href="https://www.youtube.com/watch?v=HZnNt9nnEhw"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

    </div>

  </section>


  <!-- CONTEÚDO -->

  <section id="conteudo">

    <div class="liberado">
      ♡ encontre sua lembrança
    </div>


    <div class="buscador">

      <input
        id="busca"
        type="text"
        placeholder="buscar..."
      >

      <button class="buscar">
        ♡
      </button>

    </div>

  </section>


  <div class="rodape">
    sweet.little.flower
  </div>

</main>



<!-- PLAYER YOUTUBE -->

<div class="youtube-container">

  <div id="player"></div>

</div>



<!-- API OFICIAL YOUTUBE -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/*
==================================
CONFIGURAÇÃO
==================================
*/

const VIDEO_ID =
  "HZnNt9nnEhw";


/*
Começamos alguns segundos
depois do início.
*/

const INICIO =
  25;


/*
==================================
ELEMENTOS
==================================
*/

const botaoPlay =
  document.getElementById("play");

const status =
  document.getElementById("status");

const mensagem =
  document.getElementById("mensagem");

const resposta =
  document.getElementById("resposta");

const entrada =
  document.getElementById("entrada");

const conteudo =
  document.getElementById("conteudo");


let player;

let pronto =
  false;

let tocando =
  false;


/*
==================================
YOUTUBE
==================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        width: "200",

        height: "200",

        videoId:
          VIDEO_ID,

        playerVars: {

          playsinline: 1,

          controls: 0,

          rel: 0,

          start:
            INICIO,

          origin:
            window.location.origin

        },

        events: {

          onReady:
            playerPronto,

          onStateChange:
            mudouEstado,

          onError:
            erroPlayer

        }

      }
    );

}


/*
==================================
PLAYER PRONTO
==================================
*/

function playerPronto() {

  pronto =
    true;

  botaoPlay.disabled =
    false;

  status.textContent =
    "toque para ouvir";

}


/*
==================================
PLAY / PAUSE
==================================
*/

botaoPlay.addEventListener(
  "click",

  function() {

    if (!pronto) {

      mensagem.textContent =
        "a música ainda está carregando ♫";

      return;

    }


    if (tocando) {

      player.pauseVideo();

    }

    else {

      player.playVideo();

    }

  }
);


/*
==================================
ESTADO DO PLAYER
==================================
*/

function mudouEstado(event) {

  if (
    event.data ===
    YT.PlayerState.PLAYING
  ) {

    tocando =
      true;

    botaoPlay.textContent =
      "❚❚";

    mensagem.textContent =
      "";

  }


  if (
    event.data ===
    YT.PlayerState.PAUSED
  ) {

    tocando =
      false;

    botaoPlay.textContent =
      "▶";

  }


  if (
    event.data ===
    YT.PlayerState.ENDED
  ) {

    tocando =
      false;

    botaoPlay.textContent =
      "▶";

    player.seekTo(
      INICIO,
      true
    );

  }

}


/*
==================================
ERRO DO YOUTUBE
==================================
*/

function erroPlayer(event) {

  pronto =
    false;

  botaoPlay.disabled =
    true;

  status.textContent =
    "música indisponível";

  mensagem.textContent =
    "erro do player: " +
    event.data;

}


/*
==================================
NORMALIZAR
==================================
*/

function normalizar(texto) {

  return texto
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}


/*
==================================
VALIDAÇÃO
==================================
*/

function validar() {

  const valor =
    normalizar(
      resposta.value
    );


  if (
    valor === "maneskin"
  ) {

    if (player) {

      player.pauseVideo();

      player.seekTo(
        INICIO,
        true
      );

    }


    entrada.style.display =
      "none";


    conteudo.style.display =
      "block";


    return;

  }


  mensagem.textContent =
    "tente outra vez ♫";


  resposta.value =
    "";

  resposta.focus();

}


/*
BOTÃO ENTRAR
*/

document
  .getElementById("entrar")
  .addEventListener(
    "click",
    validar
  );


/*
ENTER DO TECLADO
*/

resposta.addEventListener(
  "keydown",

  function(event) {

    if (
      event.key === "Enter"
    ) {

      validar();

    }

  }
);

</script>

</body>
</html>
